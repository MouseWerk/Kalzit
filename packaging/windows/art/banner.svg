<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 493 58" width="493" height="58">
  <!--
    The banner at the top of the installer's inner pages (WixUIBannerBmp, 493 x 58 at 100 %).
    build-art.mjs renders it as banner.bmp at twice the size, for sharp pages at 200 %.

    The left part carries the page title and description, which Windows draws in its own colors:
    it is the dialog background (#f0f0f0), and build.ps1 makes those texts opaque, so in a contrast
    theme they get the theme's background instead of standing on the picture. Nothing here is
    text. The Kalzit mark sits on an ink facet at the right, clear of the description (which
    ends at x 406).

    Colors as in dialog.svg: the product mark's ink and paper, the dark accent token, and
    Windows' own dialog background.
  -->
  <rect width="493" height="58" fill="#f0f0f0"/>
  <path d="M428 0H493V58H410Z" fill="#2a2520"/>
  <!-- Double refraction, calcite's own trait: one ray in, two parallel rays out. -->
  <g fill="none" stroke-linecap="round">
    <path d="M418 47 441 33" stroke="#f0ece6" stroke-opacity="0.22" stroke-width="1"/>
    <path d="M472 24 493 12" stroke="#f0ece6" stroke-opacity="0.22" stroke-width="1"/>
    <path d="M474 31 493 20" stroke="#dfb17f" stroke-opacity="0.45" stroke-width="1"/>
  </g>
  <!-- The product mark (MARK in tools/brand/build-icons.mjs): paper lines on ink, the top face in
       the accent. -->
  <g transform="translate(456 29) scale(1.5) translate(-12 -12)" stroke="#f0ece6" stroke-width="0.9" stroke-linecap="round" stroke-linejoin="round">
    <path d="M3.1 8.25 7.6 3.95 19.1 1.95 14.6 6.35Z" fill="#dfb17f"/>
    <path d="M3.1 8.25 14.6 6.35 16.9 19.95 5.6 22.05Z" fill="#2a2520"/>
    <path d="M14.6 6.35 19.1 1.95 20.9 15.55 16.9 19.95Z" fill="#2a2520"/>
  </g>
</svg>
