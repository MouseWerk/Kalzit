<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 493 312" width="493" height="312">
  <!--
    The picture behind the installer's first and last page (WixUIDialogBmp, 493 x 312 at 100 %).
    build-art.mjs renders it as dialog.bmp at twice the size, for sharp pages at 200 %.

    The right part carries the welcome or finish text and the finish page's check box, which
    Windows draws in its own colors from x 180 on: it is the dialog background (#f0f0f0), and
    build.ps1 makes those texts opaque, so a contrast theme never puts them on the picture. Nothing
    here is text. The graphite panel at the left holds the Kalzit mark.
  -->
  <rect width="493" height="312" fill="#f0f0f0"/>
  <path d="M0 0H170L158 312H0Z" fill="#1d1c20"/>
  <!-- Double refraction, calcite's own trait: one ray in, two parallel rays out. -->
  <g fill="none" stroke-linecap="round">
    <path d="M0 166 52 136" stroke="#f0ece6" stroke-opacity="0.2" stroke-width="1"/>
    <path d="M114 106 167 75" stroke="#f0ece6" stroke-opacity="0.2" stroke-width="1"/>
    <path d="M118 122 165 95" stroke="#d6a87a" stroke-opacity="0.42" stroke-width="1"/>
  </g>
  <!-- The mark (ui/src/components/Icon.tsx, `logo`) as a solid: copper top face, two graphite faces. -->
  <g transform="translate(82 124) scale(3.6) translate(-12 -12)" stroke="#f0ece6" stroke-width="0.42" stroke-linejoin="round">
    <path d="M3.1 8.25 7.6 3.95 19.1 1.95 14.6 6.35Z" fill="#d6a87a"/>
    <path d="M3.1 8.25 14.6 6.35 16.9 19.95 5.6 22.05Z" fill="#2c2a30"/>
    <path d="M14.6 6.35 19.1 1.95 20.9 15.55 16.9 19.95Z" fill="#232126"/>
  </g>
</svg>
