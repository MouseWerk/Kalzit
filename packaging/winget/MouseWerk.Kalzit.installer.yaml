PackageVersion: "{{VERSION}}"
InstallerType: wix
Scope: machine
InstallModes:
  - interactive
  - silent
  - silentWithProgress
UpgradeBehavior: install
ReleaseDate: "{{RELEASE_DATE}}"
Installers:
  - Architecture: x64
    InstallerUrl: "{{MSI_URL}}"
    InstallerSha256: "{{MSI_SHA256}}"
