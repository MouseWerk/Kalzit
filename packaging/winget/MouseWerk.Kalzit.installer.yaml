      - DisplayName: Kalzit
        Publisher: MouseWerk
        DisplayVersion: "{{VERSION}}"
        UpgradeCode: "{1D4828C2-1200-4926-BC6E-4959850AE762}"
ManifestType: installer
ManifestVersion: 1.9.0
