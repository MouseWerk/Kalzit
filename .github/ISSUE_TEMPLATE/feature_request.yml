name: Feature request
description: Suggest a new capability or an improvement.
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Please check the roadmap in the README, docs/PLAN.md and the open issues first; the feature may
        already be planned.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and what stops you today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: How should Kalzit solve it? Describe the behaviour, not a specific implementation.
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Dashboards and panels
        - Explore
        - Documents (MongoDB, search, files)
        - Graphs (Neo4j, Memgraph, TigerGraph, ArangoDB, Gremlin)
        - Traces (Tempo, Jaeger)
        - Analysis steps and export
        - Data sources
        - Alerting
        - Sharing, snapshots and reports
        - Provisioning and Grafana import
        - Plugins, apps and SDKs
        - AI
        - Sign-in, organizations, roles and administration
        - Installation and operation
        - Other
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives
      description: Workarounds or other solutions you considered.
