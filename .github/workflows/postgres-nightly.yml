name: PostgreSQL nightly

# The PR check runs the server tests on SQLite and only selected ones on PostgreSQL (ci.yml, job
# `postgres`). This job runs the whole server test suite with Kalzit's own database on PostgreSQL
# once a night, on demand, and on pull requests that change this file. Every test that can run
# on PostgreSQL does so here (in a throwaway schema per app or flow), and
# KALZIT_TEST_REQUIRE_POSTGRES turns a PostgreSQL test that would skip for want of the URL into a
# failure. The PostgreSQL user has a password (unlike ci.yml's `postgres` job), so the data source
# tests that read KALZIT_TEST_POSTGRES_URL exercise password handling too. It is not a required
# check.

on:
  schedule:
    - cron: "41 1 * * *"
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/postgres-nightly.yml

permissions:
  contents: read

concurrency:
  group: postgres-nightly-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  # Every test binary links the whole server; with full debug info they no longer fit on the
  # runner's disk next to the toolchain. Line tables keep panics' file and line.
  CARGO_PROFILE_DEV_DEBUG: line-tables-only

jobs:
  postgres:
    name: server tests on PostgreSQL
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      # A throwaway container reachable only from this job; its password protects nothing.
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: kalzit
          POSTGRES_PASSWORD: kalzit-ci-pg
          POSTGRES_DB: kalzit
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U kalzit" --health-interval 2s --health-timeout 5s --health-retries 30
    env:
      KALZIT_TEST_POSTGRES_URL: postgres://kalzit:kalzit-ci-pg@localhost:5432/kalzit
      KALZIT_TEST_REQUIRE_POSTGRES: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Free disk space for the test binaries
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch, 2026-10
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: postgres-nightly
      # Every test binary runs, so one night shows every failure.
      - run: cargo test --locked -p kalzit --no-fail-fast
