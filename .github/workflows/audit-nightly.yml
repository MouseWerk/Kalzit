name: Audit nightly

# The PR check audits the dependencies only when a pull request changes them (ci.yml, job
# `audit`). Advisories are published every day against versions already on main, so this job
# audits main once a night, on demand, and on pull requests that change this file or the audit
# settings: the Rust crates of Cargo.lock with `cargo audit` (its ignores, each with its reason,
# are in .cargo/audit.toml) and the npm packages of every lockfile with `npm audit`. A failed
# scheduled run is reported to the repository's admins by GitHub's workflow notifications. It is
# not a required check.

on:
  schedule:
    - cron: "23 3 * * *"
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/audit-nightly.yml
      - .cargo/audit.toml
      - .github/scripts/npm-audit.mjs
      - .github/scripts/npm-audit.test.mjs

permissions:
  contents: read

concurrency:
  group: audit-nightly-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  cargo:
    name: cargo audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: cargo-audit
      # Fetched with retries, as in ci.yml, so a network failure does not read as a finding.
      - name: Fetch the advisory database
        shell: bash
        run: |
          db="$HOME/.cargo/advisory-db"
          for attempt in 1 2 3 4 5; do
            rm -rf "$db"
            if git clone --quiet --depth 1 https://github.com/RustSec/advisory-db.git "$db"; then
              exit 0
            fi
            echo "Fetching the advisory database failed (attempt $attempt of 5)" >&2
            if [ "$attempt" -lt 5 ]; then
              sleep $((attempt * 10))
            fi
          done
          exit 1
      # Fills Cargo's local index cache, which the yanked check of `cargo audit --no-fetch` reads,
      # as in ci.yml.
      - name: Fill the crates.io index cache
        run: cargo fetch --locked
      # Unmaintained and yanked crates are warnings here, as in the PR check; vulnerabilities
      # fail the run, and so does a crate the yanked check cannot look up.
      - name: cargo audit
        shell: bash
        run: |
          status=0
          cargo audit --no-fetch 2>&1 | tee "$RUNNER_TEMP/cargo-audit.log" || status=$?
          if grep -q "couldn't check if the package is yanked" "$RUNNER_TEMP/cargo-audit.log"; then
            echo "::error::cargo audit could not check every crate for a yanked release"
            exit 1
          fi
          exit "$status"

  npm:
    name: npm audit (${{ matrix.dir }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        dir: [ui, tools/devkit, tools/devgen]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 26
      # The lockfile alone is audited; nothing is installed and no package script runs.
      # The script retries an unreachable registry and applies the ignores in
      # .github/scripts/npm-audit.mjs, each with its reason.
      - name: npm audit
        shell: bash
        env:
          DIR: ${{ matrix.dir }}
        run: node .github/scripts/npm-audit.mjs "$DIR"
