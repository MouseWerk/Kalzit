name: devgen proof

# The developer generators' proof (tools/devgen, `npm run proof`): scaffolds routes and settings
# into the checkout and runs cargo fmt, clippy, the generated and affected server tests, Biome,
# the UI typecheck and the affected UI tests, so generated code passes the repository's checks
# out of the box. Called by ci.yml for pull requests that touch what the scaffolds depend on, and
# weekly here, so drift on main shows up even without such a pull request.

on:
  workflow_call:
  workflow_dispatch:
  schedule:
    # Mondays, 03:17 UTC.
    - cron: "17 3 * * 1"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  proof:
    name: proof
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch, 2026-10
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: devgen-proof
          save-if: ${{ github.event_name != 'merge_group' }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: |
            ui/package-lock.json
            tools/devgen/package-lock.json
      - run: npm ci
        working-directory: ui
      - run: npm ci
        working-directory: tools/devgen
      - run: npm run proof -- --in-place
        working-directory: tools/devgen
