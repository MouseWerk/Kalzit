name: Gallery renders and README screenshots

# Pictures of Kalzit taken by Playwright against the real binary with the e2e services, in one of
# two sets (input `set`):
#
#   gallery  curated renders for the gallery of the website, on the fictional data center of
#            ui/e2e/gallery/datacenter.ts and the gallery fixtures in ui/e2e/fixtures (MongoDB,
#            Neo4j) plus log events in OpenSearch: 1600 x 1000 at twice the device scale, dark and
#            light, as PNG and WebP; uploaded as the artifact `kalzit-gallery`, never committed.
#   readme   the README and guide screenshots of ui/e2e/screenshots (`npm run screenshots`) on the
#            e2e fixtures, the graph and MongoDB pictures included; uploaded as the artifact
#            `kalzit-screenshots`, to be committed to docs/screenshots by hand.
#
# Run by hand only. How to run it: docs/screenshots/README.md.

on:
  workflow_dispatch:
    inputs:
      set:
        description: Which pictures to take
        type: choice
        options: [gallery, readme]
        default: gallery

permissions:
  contents: read

concurrency:
  group: gallery-${{ github.ref }}-${{ inputs.set }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  gallery:
    name: ${{ inputs.set }} pictures
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      SET: ${{ inputs.set }}
      KALZIT_E2E_BINARY: ${{ github.workspace }}/target/e2e/kalzit
      # The test plugin, installed for the pictures of the plugin pages (readme set).
      KALZIT_E2E_PLUGIN_BINARY: ${{ github.workspace }}/target/e2e/kalzit-test-plugin
      KALZIT_GALLERY_OUT: ${{ github.workspace }}/gallery
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.playwright-browsers
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # Started first, so they are up once the build is done (as in the e2e job of ci.yml).
      - name: Start MongoDB, OpenSearch, Neo4j and Memgraph
        timeout-minutes: 5
        run: .github/scripts/e2e-services.sh start
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch, 2026-10
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: gallery
      - run: npm ci
        working-directory: ui
      - run: npm run build
        working-directory: ui
      - run: cargo build --profile e2e --locked -p kalzit -p kalzit-test-plugin
      - name: Playwright version
        id: playwright
        working-directory: ui
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Restore Playwright browsers
        id: browsers
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .playwright-browsers
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - name: Install Chromium
        if: steps.browsers.outputs.cache-hit != 'true'
        timeout-minutes: 10
        working-directory: ui
        run: |
          for attempt in 1 2 3; do
            npx playwright install chromium && exit 0
            echo "::warning::installing Chromium failed (attempt $attempt of 3)"
          done
          exit 1
      - name: Install Chromium's system packages
        timeout-minutes: 12
        working-directory: ui
        run: ../.github/scripts/browser-deps.sh node node_modules/@playwright/test/cli.js install-deps chromium
      - name: Wait for MongoDB, OpenSearch, Neo4j and Memgraph
        timeout-minutes: 5
        run: .github/scripts/e2e-services.sh ready
      # The data center in MongoDB (a database of its own) and Neo4j (replacing the shop graph).
      - name: Seed the gallery data
        if: env.SET == 'gallery'
        timeout-minutes: 5
        run: .github/scripts/e2e-services.sh seed-gallery
      - run: npm run gallery
        if: env.SET == 'gallery'
        timeout-minutes: 20
        working-directory: ui
      # Writes into docs/screenshots of the checkout; the e2e fixtures stay as ready seeded them.
      - run: npm run screenshots
        if: env.SET == 'readme'
        timeout-minutes: 20
        working-directory: ui
      # Also after a failed scene, so the others can be looked at.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() && env.SET == 'gallery' }}
        with:
          name: kalzit-gallery
          path: gallery
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() && env.SET == 'readme' }}
        with:
          name: kalzit-screenshots
          path: docs/screenshots/*.png
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !success() }}
        with:
          name: ${{ inputs.set }}-output
          path: ui/e2e/.output
          if-no-files-found: ignore
          include-hidden-files: true
          retention-days: 7
