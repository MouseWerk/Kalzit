name: Release

# Builds the Windows and Linux binaries for a version tag (v0.2.0, v0.3.0-rc.1), writes the signed
# update manifest and publishes everything as a GitHub Release, which running servers find through
# their update check (docs/operations/updates.md). A tag with a pre-release part (-rc.1) becomes
# a pre-release, offered only on the preview channel. After that, the container image is pushed
# to ghcr.io (job `image`).
#
# Hardening, because the publish job holds the release signing key:
# - every action is pinned to a full commit SHA (the comment names the version it was);
# - checkouts keep no credentials;
# - only a tag on a commit of main is released;
# - the signing key lives in the `release` environment (reviewers approve each run), and the job
#   that uses it builds only the small kalzit-release crate, not the server's dependency tree.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  build:
    name: build (${{ matrix.platform }}-${{ matrix.arch }})
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
            arch: x64
            exe: ""
          - os: windows-latest
            platform: windows
            arch: x64
            exe: .exe
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    # The binary's SHA-256 per platform, checked in `publish` before signing; a leg leaves the
    # other's output empty, which does not overwrite it.
    outputs:
      sha256-linux-x64: ${{ steps.package.outputs.sha256-linux-x64 }}
      sha256-windows-x64: ${{ steps.package.outputs.sha256-windows-x64 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Tag on main, version matches
        id: version
        shell: bash
        run: |
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$GITHUB_REF_NAME does not point at a commit of main"
            exit 1
          fi
          version="${GITHUB_REF_NAME#v}"
          crate="$(grep -m1 '^version = ' server/Cargo.toml | cut -d'"' -f2)"
          if [ "$version" != "$crate" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match server/Cargo.toml version $crate"
            exit 1
          fi
          if [ ! -f "docs/releases/v$version.md" ]; then
            echo "::error::docs/releases/v$version.md is missing"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: npm ci
        working-directory: ui
      # The license lists of the bundle come from cargo, so the toolchain is installed first; the
      # build fails when they cannot be made (CI is set).
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch, 2026-10
        with:
          toolchain: stable
      - run: npm run build
        working-directory: ui
      # The public release keys, if set as a repository variable (comma-separated base64), are
      # trusted in addition to the keys in server/src/updates/signing.rs.
      - run: cargo build --release --locked -p kalzit --bin kalzit
        env:
          KALZIT_UPDATE_PUBLIC_KEYS: ${{ vars.KALZIT_UPDATE_PUBLIC_KEYS }}
      - name: Package
        id: package
        shell: bash
        run: |
          set -euo pipefail
          mkdir dist
          name="kalzit-${{ steps.version.outputs.version }}-${{ matrix.platform }}-${{ matrix.arch }}${{ matrix.exe }}"
          cp "target/release/kalzit${{ matrix.exe }}" "dist/$name"
          # The same check a server makes before it installs: the binary runs and names its version.
          "dist/$name" --version | grep -qw "${{ steps.version.outputs.version }}"
          echo "sha256-${{ matrix.platform }}-${{ matrix.arch }}=$(sha256sum "dist/$name" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: kalzit-${{ matrix.platform }}-${{ matrix.arch }}
          path: dist/
          if-no-files-found: error

  # The example plugins (examples/plugins) for Windows and Linux. Building them needs no key; the
  # hash of each binary goes on as a job output and is checked where the binary is used.
  plugin-build:
    name: plugin build (${{ matrix.platform }})
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux-x64
            exe: ""
          - os: windows-latest
            platform: windows-x64
            exe: .exe
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    # One output per platform; a leg leaves the other's empty, which does not overwrite it.
    outputs:
      sha256-linux-x64: ${{ steps.collect.outputs.sha256-linux-x64 }}
      sha256-windows-x64: ${{ steps.collect.outputs.sha256-windows-x64 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Tag on main
        shell: bash
        run: |
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$GITHUB_REF_NAME does not point at a commit of main"
            exit 1
          fi
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch, 2026-10
        with:
          toolchain: stable
      - run: cargo build --release --locked -p kalzit-csv-http
      - name: Collect
        id: collect
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p plugin-bin/${{ matrix.platform }}
          cp "target/release/kalzit-csv-http${{ matrix.exe }}" plugin-bin/${{ matrix.platform }}/
          sum="$(sha256sum "plugin-bin/${{ matrix.platform }}/kalzit-csv-http${{ matrix.exe }}" | cut -d' ' -f1)"
          echo "sha256-${{ matrix.platform }}=$sum" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: plugin-bin-${{ matrix.platform }}
          path: plugin-bin/
          if-no-files-found: error

  # Builds the example packages unsigned (one package with both binaries for the data source, one
  # for the panel) and writes their exact manifests, for signing in `plugin-sign`. No key here,
  # so the plugin crates and their dependencies never run next to it.
  plugin-package:
    name: package plugins
    needs: plugin-build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      sums: ${{ steps.package.outputs.sums }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: plugin-bin-linux-x64
          path: plugin-bin
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: plugin-bin-windows-x64
          path: plugin-bin
      - name: Check the binaries
        shell: bash
        env:
          LINUX: ${{ needs.plugin-build.outputs.sha256-linux-x64 }}
          WINDOWS: ${{ needs.plugin-build.outputs.sha256-windows-x64 }}
        run: |
          set -euo pipefail
          test -n "$LINUX" && test -n "$WINDOWS"
          printf '%s  %s\n' "$LINUX" plugin-bin/linux-x64/kalzit-csv-http \
            "$WINDOWS" plugin-bin/windows-x64/kalzit-csv-http.exe | sha256sum -c -
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch, 2026-10
        with:
          toolchain: stable
      - run: cargo build --release --locked -p kalzit-plugin-tool --bin kalzit-plugin
      - name: Package
        id: package
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p plugins
          tool=target/release/kalzit-plugin
          version="$(grep -m1 '^version = ' examples/plugins/csv-http/kalzit-plugin.toml | cut -d'"' -f2)"
          "$tool" package --manifest examples/plugins/csv-http/kalzit-plugin.toml \
            --file bin/linux-x64/kalzit-csv-http=plugin-bin/linux-x64/kalzit-csv-http \
            --file bin/windows-x64/kalzit-csv-http.exe=plugin-bin/windows-x64/kalzit-csv-http.exe \
            --file README.md=examples/plugins/csv-http/README.md \
            --unsigned --out "plugins/dev.kalzit.csv-http-$version.zip" \
            --manifest-out "plugins/dev.kalzit.csv-http-$version.toml"
          version="$(grep -m1 '^version = ' examples/plugins/panel-kpi/kalzit-plugin.toml | cut -d'"' -f2)"
          "$tool" package --manifest examples/plugins/panel-kpi/kalzit-plugin.toml \
            --file panel.js=examples/plugins/panel-kpi/panel.js \
            --file README.md=examples/plugins/panel-kpi/README.md \
            --unsigned --out "plugins/dev.kalzit.panel-kpi-$version.zip" \
            --manifest-out "plugins/dev.kalzit.panel-kpi-$version.toml"
          {
            echo "sums<<SUMS"
            (cd plugins && sha256sum -- *)
            echo "SUMS"
          } >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: plugin-unsigned
          path: plugins/
          if-no-files-found: error

  # Signs the plugin manifests with Kalzit's plugin key: KALZIT_PLUGIN_SIGNING_KEY in the
  # `release` environment (reviewers approve each run); only release tags reach it, pull requests
  # sign with a throwaway key (ci.yml, job `plugins`). It builds only the small release crate
  # (kalzit-sign) and signs only the manifests' bytes, which pin every file by its hash.
  plugin-sign:
    name: sign plugins
    needs: plugin-package
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: release
    outputs:
      sums: ${{ steps.sign.outputs.sums }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Tag on main
        shell: bash
        run: |
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$GITHUB_REF_NAME does not point at a commit of main"
            exit 1
          fi
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: plugin-unsigned
          path: plugins
      - name: Check the packages
        shell: bash
        env:
          SUMS: ${{ needs.plugin-package.outputs.sums }}
        run: |
          set -euo pipefail
          cd plugins
          printf '%s\n' "$SUMS" | sha256sum -c -
          test "$(ls | wc -l)" -eq "$(printf '%s\n' "$SUMS" | grep -c .)"
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch, 2026-10
        with:
          toolchain: stable
      - run: cargo build --release --locked -p kalzit-release --bin kalzit-sign
      - name: Sign
        id: sign
        shell: bash
        env:
          KALZIT_PLUGIN_SIGNING_KEY: ${{ secrets.KALZIT_PLUGIN_SIGNING_KEY }}
        run: |
          set -euo pipefail
          if [ -z "$KALZIT_PLUGIN_SIGNING_KEY" ]; then
            echo "::error::KALZIT_PLUGIN_SIGNING_KEY is not set in the release environment (docs/plugins/authoring.md)"
            exit 1
          fi
          args=()
          for manifest in plugins/*.toml; do args+=(--manifest "$manifest"); done
          target/release/kalzit-sign sign-plugin-manifest "${args[@]}"
          mkdir -p signatures
          mv plugins/*.toml.sig signatures/
          {
            echo "sums<<SUMS"
            (cd signatures && sha256sum -- *)
            echo "SUMS"
          } >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: plugin-signatures
          path: signatures/
          if-no-files-found: error

  # Adds the signatures to the packages and checks them against the main public key compiled
  # into Kalzit (server/src/plugins/package.rs, KALZIT_PLUGIN_MAIN_KEY), so a wrong secret fails
  # here, before anything is published. No key here.
  plugin-finish:
    name: finish plugins
    needs: [plugin-package, plugin-sign]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      sums: ${{ steps.finish.outputs.sums }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: plugin-unsigned
          path: plugins
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: plugin-signatures
          path: signatures
      - name: Check the packages and signatures
        shell: bash
        env:
          PACKAGES: ${{ needs.plugin-package.outputs.sums }}
          SIGNATURES: ${{ needs.plugin-sign.outputs.sums }}
        run: |
          set -euo pipefail
          (cd plugins && printf '%s\n' "$PACKAGES" | sha256sum -c -)
          (cd signatures && printf '%s\n' "$SIGNATURES" | sha256sum -c -)
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch, 2026-10
        with:
          toolchain: stable
      - run: cargo build --release --locked -p kalzit-plugin-tool --bin kalzit-plugin
      - name: Attach and check against Kalzit's compiled key
        id: finish
        shell: bash
        run: |
          set -euo pipefail
          public="$(sed -n 's/^pub const KALZIT_PLUGIN_MAIN_KEY: &str = "\([A-Za-z0-9+/=]*\)";$/\1/p' server/src/plugins/package.rs)"
          test -n "$public"
          mkdir -p dist
          for package in plugins/*.zip; do
            name="$(basename "$package" .zip)"
            target/release/kalzit-plugin attach-signature --package "$package" \
              --signature "signatures/$name.toml.sig" --public-key "$public" --out "dist/$name.zip"
            target/release/kalzit-plugin verify --package "dist/$name.zip" --public-key "$public"
          done
          {
            echo "sums<<SUMS"
            (cd dist && sha256sum -- *)
            echo "SUMS"
          } >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: plugin-packages
          path: dist/
          if-no-files-found: error

  # Waits for the plugin packages, so a release is never published without them.
  publish:
    name: sign and publish
    needs: [build, plugin-finish]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Holds KALZIT_RELEASE_SIGNING_KEY; required reviewers approve every run
    # (docs/operations/updates.md, "Release key").
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Tag on main
        shell: bash
        run: |
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$GITHUB_REF_NAME does not point at a commit of main"
            exit 1
          fi
      # Exactly the artifacts of this run by name, each checked against the hash its job reported.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: kalzit-linux-x64
          path: dist
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: kalzit-windows-x64
          path: dist
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: plugin-packages
          path: dist
      - name: Check the downloads
        shell: bash
        env:
          LINUX: ${{ needs.build.outputs.sha256-linux-x64 }}
          WINDOWS: ${{ needs.build.outputs.sha256-windows-x64 }}
          PLUGINS: ${{ needs.plugin-finish.outputs.sums }}
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          test -n "$LINUX" && test -n "$WINDOWS" && test -n "$PLUGINS"
          cd dist
          printf '%s  %s\n' "$LINUX" "kalzit-$version-linux-x64" \
            "$WINDOWS" "kalzit-$version-windows-x64.exe" | sha256sum -c -
          printf '%s\n' "$PLUGINS" | sha256sum -c -
          test "$(ls | wc -l)" -eq "$((2 + $(printf '%s\n' "$PLUGINS" | grep -c .)))"
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch, 2026-10
        with:
          toolchain: stable
      # Only the small release crate (ed25519-dalek, sha2, serde_json, base64 and their few
      # dependencies) is built next to the key.
      - run: cargo build --release --locked -p kalzit-release --bin kalzit-sign
      - name: Sign
        shell: bash
        env:
          KALZIT_RELEASE_SIGNING_KEY: ${{ secrets.KALZIT_RELEASE_SIGNING_KEY }}
        run: |
          if [ -z "$KALZIT_RELEASE_SIGNING_KEY" ]; then
            echo "::error::KALZIT_RELEASE_SIGNING_KEY is not set in the release environment (docs/operations/updates.md)"
            exit 1
          fi
          version="${GITHUB_REF_NAME#v}"
          channel=stable
          case "$version" in *-*) channel=preview ;; esac
          target/release/kalzit-sign release \
            --version "$version" \
            --channel "$channel" \
            --notes "docs/releases/v$version.md" \
            --notes-url "https://github.com/${GITHUB_REPOSITORY}/releases/tag/${GITHUB_REF_NAME}" \
            --package "linux:x64:dist/kalzit-$version-linux-x64" \
            --package "windows:x64:dist/kalzit-$version-windows-x64.exe" \
            --out-dir dist
      # The release with the server binaries, their signed manifest and offline packages, and
      # the signed plugin packages.
      - name: Publish
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          prerelease=""
          case "$version" in *-*) prerelease="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "Kalzit $version" \
            --notes-file "docs/releases/v$version.md" \
            --verify-tag $prerelease

  # The container image for linux/amd64 and linux/arm64, pushed to ghcr.io/mousewerk/kalzit once
  # the release is published: tags <version>, and for a stable release also <major>.<minor> and
  # latest. The server is cross-compiled in the Dockerfile, so no emulation is needed. This job
  # holds only the workflow token (packages: write), never the signing key.
  image:
    name: container image
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Tag on main, tags and labels
        id: meta
        shell: bash
        run: |
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$GITHUB_REF_NAME does not point at a commit of main"
            exit 1
          fi
          version="${GITHUB_REF_NAME#v}"
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/kalzit"
          tags="$image:$version"
          # <major>.<minor> and latest move only forward: a fix release for an older line (0.2.4
          # after 0.3.0) does not take them back.
          case "$version" in
            *-*) ;;
            *)
              git fetch --no-tags --force origin '+refs/tags/v*:refs/tags/v*'
              stable=$(git tag --list 'v*' | sed 's/^v//' | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' || true)
              line=$(echo "$version" | cut -d. -f1,2)
              if [ "$(printf '%s\n' "$stable" "$version" | grep "^${line//./\\.}\." | sort -V | tail -n1)" = "$version" ]; then
                tags="$tags,$image:$line"
              fi
              if [ "$(printf '%s\n' "$stable" "$version" | sort -V | tail -n1)" = "$version" ]; then
                tags="$tags,$image:latest"
              fi
              ;;
          esac
          echo "Tags: $tags"
          {
            echo "version=$version"
            echo "tags=$tags"
            echo "commit=$(git rev-parse --short=9 HEAD)"
            echo "date=$(date -u -d "@$(git show -s --format=%ct HEAD)" +%F)"
            echo "created=$(git show -s --format=%cI HEAD)"
          } >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          sbom: true
          provenance: mode=max
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
            REVISION=${{ github.sha }}
            CREATED=${{ steps.meta.outputs.created }}
            KALZIT_BUILD_COMMIT=${{ steps.meta.outputs.commit }}
            KALZIT_BUILD_DATE=${{ steps.meta.outputs.date }}
            KALZIT_UPDATE_PUBLIC_KEYS=${{ vars.KALZIT_UPDATE_PUBLIC_KEYS }}
          cache-from: type=gha,scope=kalzit-image-release
          cache-to: type=gha,scope=kalzit-image-release,mode=max
