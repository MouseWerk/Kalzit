name: Release

# Builds the Windows binary (x64), the Linux binaries (x64 and arm64, each on a runner of that
# processor), the Windows installer (MSI) and the Linux deb and rpm per processor (deploy/linux)
# for a version tag (v0.2.0, v0.3.0-rc.1), writes the signed
# update manifest and publishes everything as a GitHub Release, which running servers find through
# their update check (docs/operations/updates.md). A tag with a pre-release part (-rc.1) becomes
# a pre-release, offered only on the preview channel. After that, the container image is pushed
# to ghcr.io (job `image`) and signed with cosign, keyless through an OIDC token (job
# `image-sign`). The signed image is then added to the release as one gzip-compressed
# docker-archive per processor, for `docker load` and `podman load`, with a checksum file that is
# signed with cosign the same way (jobs `image-archive`, `image-archive-sign` and
# `image-archive-publish`).
#
# Hardening, because the publish job holds the release signing key:
# - every action is pinned to a full commit SHA (the comment names the version it was);
# - checkouts keep no credentials;
# - only a tag on a commit of main, or of the protected patch branch release/<version> for that
#   tag, is released;
# - the signing key lives in the `release` environment (reviewers approve each run), and the job
#   that uses it builds only the small kalzit-release crate, not the server's dependency tree;
# - the image jobs after it never see that key: only `image-sign` and `image-archive-sign` may
#   ask for an OIDC token, and neither builds or checks out anything nor may write to the release;
#   the other archive jobs hold just the workflow token (read packages, or add files to the
#   release) and archive only the digest `image` pushed, after checking its signature;
# - the archives are added to the release after `publish` created it, so GitHub's immutable
#   releases must stay off for this repository (an immutable release refuses new files).

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  build:
    name: build (${{ matrix.platform }}-${{ matrix.arch }})
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
            arch: x64
            exe: ""
            nfpm-archive: Linux_x86_64
            nfpm-sha256: 0660ca602b2d2d2ae4781a06c692b3eeb9d437ffea05b831d76e41f4a3188783
          # Built natively on an arm64 runner, not cross-compiled, so the binary runs its version
          # check and is packaged on the processor it is for.
          - os: ubuntu-24.04-arm
            platform: linux
            arch: arm64
            exe: ""
            nfpm-archive: Linux_arm64
            nfpm-sha256: 1c0f5f2999b9a974bfb04fdb0cc3306096de530ac5dbb25d739cc5f5219c919c
          - os: windows-latest
            platform: windows
            arch: x64
            exe: .exe
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    # The binary's SHA-256 per platform, checked in `publish` before signing; a leg leaves the
    # others' outputs empty, which does not overwrite them.
    outputs:
      sha256-linux-x64: ${{ steps.package.outputs.sha256-linux-x64 }}
      sha256-linux-arm64: ${{ steps.package.outputs.sha256-linux-arm64 }}
      sha256-windows-x64: ${{ steps.package.outputs.sha256-windows-x64 }}
      # The deb and rpm per processor, Linux legs only.
      sha256-deb-x64: ${{ steps.system-packages.outputs.sha256-deb-x64 }}
      sha256-rpm-x64: ${{ steps.system-packages.outputs.sha256-rpm-x64 }}
      sha256-deb-arm64: ${{ steps.system-packages.outputs.sha256-deb-arm64 }}
      sha256-rpm-arm64: ${{ steps.system-packages.outputs.sha256-rpm-arm64 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Tag on main or its release branch, version matches
        id: version
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # A release comes from main, or for a patch from its protected branch release/<version>.
          tag_version="${GITHUB_REF_NAME#v}"
          git fetch --no-tags origin main
          source_branch=""
          if git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then source_branch=main; fi
          if [ -z "$source_branch" ] && git fetch --no-tags origin "release/$tag_version" 2>/dev/null &&
            git merge-base --is-ancestor "$GITHUB_SHA" FETCH_HEAD; then
            source_branch="release/$tag_version"
          fi
          if [ -z "$source_branch" ]; then
            echo "::error::$GITHUB_REF_NAME does not point at a commit of main or of release/$tag_version"
            exit 1
          fi
          # A release branch must be protected like main: changes only through pull requests, with
          # the required checks, and made only by those allowed to (creation restricted), with
          # nobody bypassing its rulesets. Read with this run's read-only token.
          if [ "$source_branch" != main ]; then
            active="$(gh api --paginate "repos/$GITHUB_REPOSITORY/rules/branches/$source_branch" \
              --jq '.[] | "\(.type) \(.ruleset_id)"')" || {
              echo "::error::the rules of $source_branch cannot be read"
              exit 1
            }
            rules=" $(printf '%s\n' "$active" | cut -d' ' -f1 | tr '\n' ' ') "
            for rule in pull_request required_status_checks creation; do
              case "$rules" in
                *" $rule "*) ;;
                *)
                  echo "::error::$source_branch is not protected by the rule $rule"
                  exit 1
                  ;;
              esac
            done
            # Every ruleset that applies: no bypass actors. The list is only shown to those who
            # may edit the ruleset, so this token may see it empty; `current_user_can_bypass`
            # must say `never` as well.
            for ruleset in $(printf '%s\n' "$active" | cut -d' ' -f2 | sort -u); do
              bypass="$(gh api "repos/$GITHUB_REPOSITORY/rulesets/$ruleset" \
                --jq '"\((.bypass_actors // []) | length) \(.current_user_can_bypass // "never")"')" || {
                echo "::error::ruleset $ruleset of $source_branch cannot be read"
                exit 1
              }
              if [ "$bypass" != "0 never" ]; then
                echo "::error::ruleset $ruleset of $source_branch can be bypassed ($bypass)"
                exit 1
              fi
            done
          fi
          version="${GITHUB_REF_NAME#v}"
          crate="$(grep -m1 '^version = ' server/Cargo.toml | cut -d'"' -f2)"
          if [ "$version" != "$crate" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match server/Cargo.toml version $crate"
            exit 1
          fi
          if [ ! -f "docs/releases/v$version.md" ]; then
            echo "::error::docs/releases/v$version.md is missing"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: npm ci
        working-directory: ui
      # The license lists of the bundle come from cargo, so the toolchain is installed first; the
      # build fails when they cannot be made (CI is set).
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch, 2026-10
        with:
          toolchain: stable
      - run: npm run build
        working-directory: ui
      # The public release keys, if set as a repository variable (comma-separated base64), are
      # trusted in addition to the keys in server/src/updates/signing.rs.
      - run: cargo build --release --locked -p kalzit --bin kalzit
        env:
          KALZIT_UPDATE_PUBLIC_KEYS: ${{ vars.KALZIT_UPDATE_PUBLIC_KEYS }}
      - name: Package
        id: package
        shell: bash
        run: |
          set -euo pipefail
          mkdir dist
          name="kalzit-${{ steps.version.outputs.version }}-${{ matrix.platform }}-${{ matrix.arch }}${{ matrix.exe }}"
          cp "target/release/kalzit${{ matrix.exe }}" "dist/$name"
          # The same check a server makes before it installs: the binary runs and names its version.
          "dist/$name" --version | grep -qw "${{ steps.version.outputs.version }}"
          echo "sha256-${{ matrix.platform }}-${{ matrix.arch }}=$(sha256sum "dist/$name" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
      # The deb and rpm (deploy/linux) around exactly this binary; nfpm is checked against its
      # published SHA-256 before it runs.
      - name: Install nfpm
        if: matrix.platform == 'linux'
        shell: bash
        env:
          NFPM_VERSION: 2.47.0
          NFPM_ARCHIVE: ${{ matrix.nfpm-archive }}
          NFPM_SHA256: ${{ matrix.nfpm-sha256 }}
        run: |
          set -euo pipefail
          archive="nfpm_${NFPM_VERSION}_${NFPM_ARCHIVE}.tar.gz"
          curl -fsSL --retry 5 --retry-all-errors --retry-delay 10 -o "$RUNNER_TEMP/$archive" "https://github.com/goreleaser/nfpm/releases/download/v${NFPM_VERSION}/$archive"
          echo "$NFPM_SHA256  $RUNNER_TEMP/$archive" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" nfpm
          sudo install -m 0755 "$RUNNER_TEMP/nfpm" /usr/local/bin/nfpm
      - name: Linux packages
        if: matrix.platform == 'linux'
        id: system-packages
        shell: bash
        run: |
          set -euo pipefail
          version="${{ steps.version.outputs.version }}"
          arch="${{ matrix.arch }}"
          deploy/linux/package.sh "$version" "dist/kalzit-$version-linux-$arch" dist
          echo "sha256-deb-$arch=$(sha256sum "dist/kalzit-$version-linux-$arch.deb" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          echo "sha256-rpm-$arch=$(sha256sum "dist/kalzit-$version-linux-$arch.rpm" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: kalzit-${{ matrix.platform }}-${{ matrix.arch }}
          path: dist/
          if-no-files-found: error

  # The Windows program and its MSI package (packaging/windows), signed with Authenticode in two
  # small jobs of their own and built in between in a job without any secret:
  #
  # - `windows-sign-exe` signs kalzit.exe, `windows-msi` builds the MSI from the signed program,
  #   `windows-sign-msi` signs the MSI. Only the signing jobs use the environment
  #   `windows-signing`, which holds nothing but the code-signing secrets (and should have required
  #   reviewers); they run checkout, download, signtool and upload only, and no other tool runs
  #   while key material is present (packaging/windows/sign.ps1).
  # - Recommended: Microsoft Artifact Signing (formerly Azure Trusted Signing), whose key never
  #   leaves Microsoft's HSM: variables KALZIT_ARTIFACT_SIGNING_ENDPOINT, _ACCOUNT and _PROFILE,
  #   secrets AZURE_TENANT_ID, AZURE_CLIENT_ID and AZURE_CLIENT_SECRET. Otherwise a PFX with an
  #   exportable key: secrets KALZIT_WINDOWS_CERT (base64) and KALZIT_WINDOWS_CERT_PASSWORD.
  #   Without either, both files stay unsigned and the release notes say so.
  # - Signing changes the files, so the hashes that go into the manifest come from these jobs.
  windows-sign-exe:
    name: windows sign program
    needs: build
    runs-on: windows-latest
    timeout-minutes: 20
    environment: windows-signing
    outputs:
      sha256: ${{ steps.hash.outputs.sha256 }}
      mode: ${{ steps.mode.outputs.mode }}
    env:
      VERSION: ${{ github.ref_name }}
      EXPECTED: ${{ needs.build.outputs.sha256-windows-x64 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Tag on main or its release branch
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # A release comes from main, or for a patch from its protected branch release/<version>.
          tag_version="${GITHUB_REF_NAME#v}"
          git fetch --no-tags origin main
          source_branch=""
          if git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then source_branch=main; fi
          if [ -z "$source_branch" ] && git fetch --no-tags origin "release/$tag_version" 2>/dev/null &&
            git merge-base --is-ancestor "$GITHUB_SHA" FETCH_HEAD; then
            source_branch="release/$tag_version"
          fi
          if [ -z "$source_branch" ]; then
            echo "::error::$GITHUB_REF_NAME does not point at a commit of main or of release/$tag_version"
            exit 1
          fi
          # A release branch must be protected like main: changes only through pull requests, with
          # the required checks, and made only by those allowed to (creation restricted), with
          # nobody bypassing its rulesets. Read with this run's read-only token.
          if [ "$source_branch" != main ]; then
            active="$(gh api --paginate "repos/$GITHUB_REPOSITORY/rules/branches/$source_branch" \
              --jq '.[] | "\(.type) \(.ruleset_id)"')" || {
              echo "::error::the rules of $source_branch cannot be read"
              exit 1
            }
            rules=" $(printf '%s\n' "$active" | cut -d' ' -f1 | tr '\n' ' ') "
            for rule in pull_request required_status_checks creation; do
              case "$rules" in
                *" $rule "*) ;;
                *)
                  echo "::error::$source_branch is not protected by the rule $rule"
                  exit 1
                  ;;
              esac
            done
            # Every ruleset that applies: no bypass actors. The list is only shown to those who
            # may edit the ruleset, so this token may see it empty; `current_user_can_bypass`
            # must say `never` as well.
            for ruleset in $(printf '%s\n' "$active" | cut -d' ' -f2 | sort -u); do
              bypass="$(gh api "repos/$GITHUB_REPOSITORY/rulesets/$ruleset" \
                --jq '"\((.bypass_actors // []) | length) \(.current_user_can_bypass // "never")"')" || {
                echo "::error::ruleset $ruleset of $source_branch cannot be read"
                exit 1
              }
              if [ "$bypass" != "0 never" ]; then
                echo "::error::ruleset $ruleset of $source_branch can be bypassed ($bypass)"
                exit 1
              fi
            done
          fi
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: kalzit-windows-x64
          path: dist
      - name: Check the download
        shell: bash
        run: |
          set -euo pipefail
          test -n "$EXPECTED"
          printf '%s  %s\n' "$EXPECTED" "dist/kalzit-${VERSION#v}-windows-x64.exe" | sha256sum -c -
      - name: Signing mode
        id: mode
        shell: bash
        env:
          ACCOUNT: ${{ vars.KALZIT_ARTIFACT_SIGNING_ACCOUNT }}
          CERT: ${{ secrets.KALZIT_WINDOWS_CERT }}
        run: |
          if [ -n "$ACCOUNT" ]; then
            echo "mode=artifact-signing" >> "$GITHUB_OUTPUT"
          elif [ -n "$CERT" ]; then
            echo "mode=pfx" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::no code-signing account or certificate in the windows-signing environment: the Windows program and installer stay unsigned"
            echo "mode=none" >> "$GITHUB_OUTPUT"
          fi
      - name: Sign
        if: steps.mode.outputs.mode != 'none'
        shell: pwsh
        env:
          MODE: ${{ steps.mode.outputs.mode }}
          TIMESTAMP_URL: ${{ vars.KALZIT_WINDOWS_TIMESTAMP_URL }}
          ARTIFACT_SIGNING_ENDPOINT: ${{ vars.KALZIT_ARTIFACT_SIGNING_ENDPOINT }}
          ARTIFACT_SIGNING_ACCOUNT: ${{ vars.KALZIT_ARTIFACT_SIGNING_ACCOUNT }}
          ARTIFACT_SIGNING_PROFILE: ${{ vars.KALZIT_ARTIFACT_SIGNING_PROFILE }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          CERT: ${{ secrets.KALZIT_WINDOWS_CERT }}
          CERT_PASSWORD: ${{ secrets.KALZIT_WINDOWS_CERT_PASSWORD }}
        run: ./packaging/windows/sign.ps1 -Files "dist/kalzit-$($env:VERSION.TrimStart('v'))-windows-x64.exe" -Mode $env:MODE -TimestampUrl $env:TIMESTAMP_URL
      # The program is not run here, next to the signing secrets; `windows-msi` runs it.
      - name: Hash
        id: hash
        shell: bash
        run: echo "sha256=$(sha256sum "dist/kalzit-${VERSION#v}-windows-x64.exe" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: kalzit-windows-x64-signed-exe
          path: dist/
          if-no-files-found: error

  windows-msi:
    name: windows installer
    needs: windows-sign-exe
    runs-on: windows-latest
    timeout-minutes: 30
    outputs:
      sha256: ${{ steps.hash.outputs.sha256 }}
    env:
      VERSION: ${{ github.ref_name }}
      EXPECTED: ${{ needs.windows-sign-exe.outputs.sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: kalzit-windows-x64-signed-exe
          path: dist
      - name: Check the download
        shell: bash
        run: |
          set -euo pipefail
          test -n "$EXPECTED"
          printf '%s  %s\n' "$EXPECTED" "dist/kalzit-${VERSION#v}-windows-x64.exe" | sha256sum -c -
      - name: The signed program runs and names its version
        shell: bash
        run: |
          "dist/kalzit-${VERSION#v}-windows-x64.exe" --version | grep -qw "${VERSION#v}"
      - name: Install WiX
        run: |
          dotnet tool install --global wix --version 5.0.2
          wix extension add --global WixToolset.UI.wixext/5.0.2
      - name: Build the MSI package
        shell: pwsh
        run: |
          $version = $env:VERSION.TrimStart('v')
          New-Item -ItemType Directory -Force msi | Out-Null
          ./packaging/windows/build.ps1 -Exe "dist/kalzit-$version-windows-x64.exe" -Version $version -Out "msi/kalzit-$version-windows-x64.msi"
          # Only a package that carries exactly the signed program goes on to be signed.
          ./packaging/windows/check-msi.ps1 -Msi "msi/kalzit-$version-windows-x64.msi" -Exe "dist/kalzit-$version-windows-x64.exe"
      - name: Hash
        id: hash
        shell: bash
        run: echo "sha256=$(sha256sum "msi/kalzit-${VERSION#v}-windows-x64.msi" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: kalzit-windows-x64-msi-unsigned
          path: msi/*.msi
          if-no-files-found: error

  windows-sign-msi:
    name: windows sign installer
    needs: [windows-sign-exe, windows-msi]
    runs-on: windows-latest
    timeout-minutes: 20
    environment: windows-signing
    outputs:
      sha256: ${{ steps.hash.outputs.sha256 }}
    env:
      VERSION: ${{ github.ref_name }}
      EXPECTED: ${{ needs.windows-msi.outputs.sha256 }}
      MODE: ${{ needs.windows-sign-exe.outputs.mode }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: kalzit-windows-x64-msi-unsigned
          path: msi
      - name: Check the download
        shell: bash
        run: |
          set -euo pipefail
          test -n "$EXPECTED"
          printf '%s  %s\n' "$EXPECTED" "msi/kalzit-${VERSION#v}-windows-x64.msi" | sha256sum -c -
      - name: Sign
        if: env.MODE != 'none'
        shell: pwsh
        env:
          TIMESTAMP_URL: ${{ vars.KALZIT_WINDOWS_TIMESTAMP_URL }}
          ARTIFACT_SIGNING_ENDPOINT: ${{ vars.KALZIT_ARTIFACT_SIGNING_ENDPOINT }}
          ARTIFACT_SIGNING_ACCOUNT: ${{ vars.KALZIT_ARTIFACT_SIGNING_ACCOUNT }}
          ARTIFACT_SIGNING_PROFILE: ${{ vars.KALZIT_ARTIFACT_SIGNING_PROFILE }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          CERT: ${{ secrets.KALZIT_WINDOWS_CERT }}
          CERT_PASSWORD: ${{ secrets.KALZIT_WINDOWS_CERT_PASSWORD }}
        run: ./packaging/windows/sign.ps1 -Files "msi/kalzit-$($env:VERSION.TrimStart('v'))-windows-x64.msi" -Mode $env:MODE -TimestampUrl $env:TIMESTAMP_URL
      - name: Hash
        id: hash
        shell: bash
        run: echo "sha256=$(sha256sum "msi/kalzit-${VERSION#v}-windows-x64.msi" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: kalzit-windows-x64-msi
          path: msi/*.msi
          if-no-files-found: error

  # The example plugins (examples/plugins) for Windows and Linux. Building them needs no key; the
  # hash of each binary goes on as a job output and is checked where the binary is used.
  plugin-build:
    name: plugin build (${{ matrix.platform }})
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux-x64
            exe: ""
          - os: windows-latest
            platform: windows-x64
            exe: .exe
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    # One output per platform; a leg leaves the other's empty, which does not overwrite it.
    outputs:
      sha256-linux-x64: ${{ steps.collect.outputs.sha256-linux-x64 }}
      sha256-windows-x64: ${{ steps.collect.outputs.sha256-windows-x64 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Tag on main or its release branch
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # A release comes from main, or for a patch from its protected branch release/<version>.
          tag_version="${GITHUB_REF_NAME#v}"
          git fetch --no-tags origin main
          source_branch=""
          if git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then source_branch=main; fi
          if [ -z "$source_branch" ] && git fetch --no-tags origin "release/$tag_version" 2>/dev/null &&
            git merge-base --is-ancestor "$GITHUB_SHA" FETCH_HEAD; then
            source_branch="release/$tag_version"
          fi
          if [ -z "$source_branch" ]; then
            echo "::error::$GITHUB_REF_NAME does not point at a commit of main or of release/$tag_version"
            exit 1
          fi
          # A release branch must be protected like main: changes only through pull requests, with
          # the required checks, and made only by those allowed to (creation restricted), with
          # nobody bypassing its rulesets. Read with this run's read-only token.
          if [ "$source_branch" != main ]; then
            active="$(gh api --paginate "repos/$GITHUB_REPOSITORY/rules/branches/$source_branch" \
              --jq '.[] | "\(.type) \(.ruleset_id)"')" || {
              echo "::error::the rules of $source_branch cannot be read"
              exit 1
            }
            rules=" $(printf '%s\n' "$active" | cut -d' ' -f1 | tr '\n' ' ') "
            for rule in pull_request required_status_checks creation; do
              case "$rules" in
                *" $rule "*) ;;
                *)
                  echo "::error::$source_branch is not protected by the rule $rule"
                  exit 1
                  ;;
              esac
            done
            # Every ruleset that applies: no bypass actors. The list is only shown to those who
            # may edit the ruleset, so this token may see it empty; `current_user_can_bypass`
            # must say `never` as well.
            for ruleset in $(printf '%s\n' "$active" | cut -d' ' -f2 | sort -u); do
              bypass="$(gh api "repos/$GITHUB_REPOSITORY/rulesets/$ruleset" \
                --jq '"\((.bypass_actors // []) | length) \(.current_user_can_bypass // "never")"')" || {
                echo "::error::ruleset $ruleset of $source_branch cannot be read"
                exit 1
              }
              if [ "$bypass" != "0 never" ]; then
                echo "::error::ruleset $ruleset of $source_branch can be bypassed ($bypass)"
                exit 1
              fi
            done
          fi
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch, 2026-10
        with:
          toolchain: stable
      - run: cargo build --release --locked -p kalzit-csv-http
      - name: Collect
        id: collect
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p plugin-bin/${{ matrix.platform }}
          cp "target/release/kalzit-csv-http${{ matrix.exe }}" plugin-bin/${{ matrix.platform }}/
          sum="$(sha256sum "plugin-bin/${{ matrix.platform }}/kalzit-csv-http${{ matrix.exe }}" | cut -d' ' -f1)"
          echo "sha256-${{ matrix.platform }}=$sum" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: plugin-bin-${{ matrix.platform }}
          path: plugin-bin/
          if-no-files-found: error

  # Builds the example packages unsigned (one package with both binaries for the data source, one
  # for the panel) and writes their exact manifests, for signing in `plugin-sign`. No key here,
  # so the plugin crates and their dependencies never run next to it.
  plugin-package:
    name: package plugins
    needs: plugin-build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      sums: ${{ steps.package.outputs.sums }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: plugin-bin-linux-x64
          path: plugin-bin
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: plugin-bin-windows-x64
          path: plugin-bin
      - name: Check the binaries
        shell: bash
        env:
          LINUX: ${{ needs.plugin-build.outputs.sha256-linux-x64 }}
          WINDOWS: ${{ needs.plugin-build.outputs.sha256-windows-x64 }}
        run: |
          set -euo pipefail
          test -n "$LINUX" && test -n "$WINDOWS"
          printf '%s  %s\n' "$LINUX" plugin-bin/linux-x64/kalzit-csv-http \
            "$WINDOWS" plugin-bin/windows-x64/kalzit-csv-http.exe | sha256sum -c -
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch, 2026-10
        with:
          toolchain: stable
      - run: cargo build --release --locked -p kalzit-plugin-tool --bin kalzit-plugin
      - name: Package
        id: package
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p plugins
          tool=target/release/kalzit-plugin
          version="$(grep -m1 '^version = ' examples/plugins/csv-http/kalzit-plugin.toml | cut -d'"' -f2)"
          "$tool" package --manifest examples/plugins/csv-http/kalzit-plugin.toml \
            --file bin/linux-x64/kalzit-csv-http=plugin-bin/linux-x64/kalzit-csv-http \
            --file bin/windows-x64/kalzit-csv-http.exe=plugin-bin/windows-x64/kalzit-csv-http.exe \
            --file README.md=examples/plugins/csv-http/README.md \
            --unsigned --out "plugins/dev.kalzit.csv-http-$version.zip" \
            --manifest-out "plugins/dev.kalzit.csv-http-$version.toml"
          version="$(grep -m1 '^version = ' examples/plugins/panel-kpi/kalzit-plugin.toml | cut -d'"' -f2)"
          "$tool" package --manifest examples/plugins/panel-kpi/kalzit-plugin.toml \
            --file panel.js=examples/plugins/panel-kpi/panel.js \
            --file README.md=examples/plugins/panel-kpi/README.md \
            --unsigned --out "plugins/dev.kalzit.panel-kpi-$version.zip" \
            --manifest-out "plugins/dev.kalzit.panel-kpi-$version.toml"
          {
            echo "sums<<SUMS"
            (cd plugins && sha256sum -- *)
            echo "SUMS"
          } >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: plugin-unsigned
          path: plugins/
          if-no-files-found: error

  # Signs the plugin manifests with Kalzit's plugin key: KALZIT_PLUGIN_SIGNING_KEY in the
  # `release` environment (reviewers approve each run); only release tags reach it, pull requests
  # sign with a throwaway key (ci.yml, job `plugins`). It builds only the small release crate
  # (kalzit-sign) and signs only the manifests' bytes, which pin every file by its hash.
  plugin-sign:
    name: sign plugins
    needs: plugin-package
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: release
    outputs:
      sums: ${{ steps.sign.outputs.sums }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Tag on main or its release branch
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # A release comes from main, or for a patch from its protected branch release/<version>.
          tag_version="${GITHUB_REF_NAME#v}"
          git fetch --no-tags origin main
          source_branch=""
          if git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then source_branch=main; fi
          if [ -z "$source_branch" ] && git fetch --no-tags origin "release/$tag_version" 2>/dev/null &&
            git merge-base --is-ancestor "$GITHUB_SHA" FETCH_HEAD; then
            source_branch="release/$tag_version"
          fi
          if [ -z "$source_branch" ]; then
            echo "::error::$GITHUB_REF_NAME does not point at a commit of main or of release/$tag_version"
            exit 1
          fi
          # A release branch must be protected like main: changes only through pull requests, with
          # the required checks, and made only by those allowed to (creation restricted), with
          # nobody bypassing its rulesets. Read with this run's read-only token.
          if [ "$source_branch" != main ]; then
            active="$(gh api --paginate "repos/$GITHUB_REPOSITORY/rules/branches/$source_branch" \
              --jq '.[] | "\(.type) \(.ruleset_id)"')" || {
              echo "::error::the rules of $source_branch cannot be read"
              exit 1
            }
            rules=" $(printf '%s\n' "$active" | cut -d' ' -f1 | tr '\n' ' ') "
            for rule in pull_request required_status_checks creation; do
              case "$rules" in
                *" $rule "*) ;;
                *)
                  echo "::error::$source_branch is not protected by the rule $rule"
                  exit 1
                  ;;
              esac
            done
            # Every ruleset that applies: no bypass actors. The list is only shown to those who
            # may edit the ruleset, so this token may see it empty; `current_user_can_bypass`
            # must say `never` as well.
            for ruleset in $(printf '%s\n' "$active" | cut -d' ' -f2 | sort -u); do
              bypass="$(gh api "repos/$GITHUB_REPOSITORY/rulesets/$ruleset" \
                --jq '"\((.bypass_actors // []) | length) \(.current_user_can_bypass // "never")"')" || {
                echo "::error::ruleset $ruleset of $source_branch cannot be read"
                exit 1
              }
              if [ "$bypass" != "0 never" ]; then
                echo "::error::ruleset $ruleset of $source_branch can be bypassed ($bypass)"
                exit 1
              fi
            done
          fi
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: plugin-unsigned
          path: plugins
      - name: Check the packages
        shell: bash
        env:
          SUMS: ${{ needs.plugin-package.outputs.sums }}
        run: |
          set -euo pipefail
          cd plugins
          printf '%s\n' "$SUMS" | sha256sum -c -
          test "$(ls | wc -l)" -eq "$(printf '%s\n' "$SUMS" | grep -c .)"
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch, 2026-10
        with:
          toolchain: stable
      - run: cargo build --release --locked -p kalzit-release --bin kalzit-sign
      - name: Sign
        id: sign
        shell: bash
        env:
          KALZIT_PLUGIN_SIGNING_KEY: ${{ secrets.KALZIT_PLUGIN_SIGNING_KEY }}
        run: |
          set -euo pipefail
          if [ -z "$KALZIT_PLUGIN_SIGNING_KEY" ]; then
            echo "::error::KALZIT_PLUGIN_SIGNING_KEY is not set in the release environment (docs/plugins/authoring.md)"
            exit 1
          fi
          args=()
          for manifest in plugins/*.toml; do args+=(--manifest "$manifest"); done
          target/release/kalzit-sign sign-plugin-manifest "${args[@]}"
          mkdir -p signatures
          mv plugins/*.toml.sig signatures/
          {
            echo "sums<<SUMS"
            (cd signatures && sha256sum -- *)
            echo "SUMS"
          } >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: plugin-signatures
          path: signatures/
          if-no-files-found: error

  # Adds the signatures to the packages and checks them against the main public key compiled
  # into Kalzit (server/src/plugins/package.rs, KALZIT_PLUGIN_MAIN_KEY), so a wrong secret fails
  # here, before anything is published. No key here.
  plugin-finish:
    name: finish plugins
    needs: [plugin-package, plugin-sign]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      sums: ${{ steps.finish.outputs.sums }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: plugin-unsigned
          path: plugins
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: plugin-signatures
          path: signatures
      - name: Check the packages and signatures
        shell: bash
        env:
          PACKAGES: ${{ needs.plugin-package.outputs.sums }}
          SIGNATURES: ${{ needs.plugin-sign.outputs.sums }}
        run: |
          set -euo pipefail
          (cd plugins && printf '%s\n' "$PACKAGES" | sha256sum -c -)
          (cd signatures && printf '%s\n' "$SIGNATURES" | sha256sum -c -)
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch, 2026-10
        with:
          toolchain: stable
      - run: cargo build --release --locked -p kalzit-plugin-tool --bin kalzit-plugin
      - name: Attach and check against Kalzit's compiled key
        id: finish
        shell: bash
        run: |
          set -euo pipefail
          public="$(sed -n 's/^pub const KALZIT_PLUGIN_MAIN_KEY: &str = "\([A-Za-z0-9+/=]*\)";$/\1/p' server/src/plugins/package.rs)"
          test -n "$public"
          mkdir -p dist
          for package in plugins/*.zip; do
            name="$(basename "$package" .zip)"
            target/release/kalzit-plugin attach-signature --package "$package" \
              --signature "signatures/$name.toml.sig" --public-key "$public" --out "dist/$name.zip"
            target/release/kalzit-plugin verify --package "dist/$name.zip" --public-key "$public"
          done
          {
            echo "sums<<SUMS"
            (cd dist && sha256sum -- *)
            echo "SUMS"
          } >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: plugin-packages
          path: dist/
          if-no-files-found: error

  # Waits for the Windows package and the plugin packages, so a release is never published
  # without them.
  publish:
    name: sign and publish
    needs: [build, windows-sign-exe, windows-sign-msi, plugin-finish]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Holds KALZIT_RELEASE_SIGNING_KEY; required reviewers approve every run
    # (docs/operations/updates.md, "Release key").
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Tag on main or its release branch
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # A release comes from main, or for a patch from its protected branch release/<version>.
          tag_version="${GITHUB_REF_NAME#v}"
          git fetch --no-tags origin main
          source_branch=""
          if git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then source_branch=main; fi
          if [ -z "$source_branch" ] && git fetch --no-tags origin "release/$tag_version" 2>/dev/null &&
            git merge-base --is-ancestor "$GITHUB_SHA" FETCH_HEAD; then
            source_branch="release/$tag_version"
          fi
          if [ -z "$source_branch" ]; then
            echo "::error::$GITHUB_REF_NAME does not point at a commit of main or of release/$tag_version"
            exit 1
          fi
          # A release branch must be protected like main: changes only through pull requests, with
          # the required checks, and made only by those allowed to (creation restricted), with
          # nobody bypassing its rulesets. Read with this run's read-only token.
          if [ "$source_branch" != main ]; then
            active="$(gh api --paginate "repos/$GITHUB_REPOSITORY/rules/branches/$source_branch" \
              --jq '.[] | "\(.type) \(.ruleset_id)"')" || {
              echo "::error::the rules of $source_branch cannot be read"
              exit 1
            }
            rules=" $(printf '%s\n' "$active" | cut -d' ' -f1 | tr '\n' ' ') "
            for rule in pull_request required_status_checks creation; do
              case "$rules" in
                *" $rule "*) ;;
                *)
                  echo "::error::$source_branch is not protected by the rule $rule"
                  exit 1
                  ;;
              esac
            done
            # Every ruleset that applies: no bypass actors. The list is only shown to those who
            # may edit the ruleset, so this token may see it empty; `current_user_can_bypass`
            # must say `never` as well.
            for ruleset in $(printf '%s\n' "$active" | cut -d' ' -f2 | sort -u); do
              bypass="$(gh api "repos/$GITHUB_REPOSITORY/rulesets/$ruleset" \
                --jq '"\((.bypass_actors // []) | length) \(.current_user_can_bypass // "never")"')" || {
                echo "::error::ruleset $ruleset of $source_branch cannot be read"
                exit 1
              }
              if [ "$bypass" != "0 never" ]; then
                echo "::error::ruleset $ruleset of $source_branch can be bypassed ($bypass)"
                exit 1
              fi
            done
          fi
      # Exactly the artifacts of this run by name, each checked against the hash its job reported.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: kalzit-linux-x64
          path: dist
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: kalzit-linux-arm64
          path: dist
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: kalzit-windows-x64-signed-exe
          path: dist
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: kalzit-windows-x64-msi
          path: dist
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: plugin-packages
          path: dist
      - name: Check the downloads
        shell: bash
        env:
          LINUX: ${{ needs.build.outputs.sha256-linux-x64 }}
          LINUX_ARM64: ${{ needs.build.outputs.sha256-linux-arm64 }}
          WINDOWS: ${{ needs.windows-sign-exe.outputs.sha256 }}
          MSI: ${{ needs.windows-sign-msi.outputs.sha256 }}
          DEB: ${{ needs.build.outputs.sha256-deb-x64 }}
          RPM: ${{ needs.build.outputs.sha256-rpm-x64 }}
          DEB_ARM64: ${{ needs.build.outputs.sha256-deb-arm64 }}
          RPM_ARM64: ${{ needs.build.outputs.sha256-rpm-arm64 }}
          PLUGINS: ${{ needs.plugin-finish.outputs.sums }}
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          for sum in "$LINUX" "$LINUX_ARM64" "$WINDOWS" "$MSI" "$DEB" "$RPM" "$DEB_ARM64" "$RPM_ARM64" "$PLUGINS"; do
            test -n "$sum"
          done
          cd dist
          printf '%s  %s\n' "$LINUX" "kalzit-$version-linux-x64" \
            "$LINUX_ARM64" "kalzit-$version-linux-arm64" \
            "$WINDOWS" "kalzit-$version-windows-x64.exe" \
            "$MSI" "kalzit-$version-windows-x64.msi" \
            "$DEB" "kalzit-$version-linux-x64.deb" \
            "$RPM" "kalzit-$version-linux-x64.rpm" \
            "$DEB_ARM64" "kalzit-$version-linux-arm64.deb" \
            "$RPM_ARM64" "kalzit-$version-linux-arm64.rpm" | sha256sum -c -
          printf '%s\n' "$PLUGINS" | sha256sum -c -
          test "$(ls | wc -l)" -eq "$((8 + $(printf '%s\n' "$PLUGINS" | grep -c .)))"
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch, 2026-10
        with:
          toolchain: stable
      # Only the small release crate (ed25519-dalek, sha2, serde_json, base64 and their few
      # dependencies) is built next to the key.
      - run: cargo build --release --locked -p kalzit-release --bin kalzit-sign
      - name: Sign
        shell: bash
        env:
          KALZIT_RELEASE_SIGNING_KEY: ${{ secrets.KALZIT_RELEASE_SIGNING_KEY }}
        run: |
          if [ -z "$KALZIT_RELEASE_SIGNING_KEY" ]; then
            echo "::error::KALZIT_RELEASE_SIGNING_KEY is not set in the release environment (docs/operations/updates.md)"
            exit 1
          fi
          version="${GITHUB_REF_NAME#v}"
          channel=stable
          case "$version" in *-*) channel=preview ;; esac
          target/release/kalzit-sign release \
            --version "$version" \
            --channel "$channel" \
            --notes "docs/releases/v$version.md" \
            --notes-url "https://github.com/${GITHUB_REPOSITORY}/releases/tag/${GITHUB_REF_NAME}" \
            --package "linux:x64:dist/kalzit-$version-linux-x64" \
            --package "linux:arm64:dist/kalzit-$version-linux-arm64" \
            --package "windows:x64:dist/kalzit-$version-windows-x64.exe" \
            --installer "windows:x64:dist/kalzit-$version-windows-x64.msi" \
            --installer "linux:x64:dist/kalzit-$version-linux-x64.deb" \
            --installer "linux:x64:dist/kalzit-$version-linux-x64.rpm" \
            --installer "linux:arm64:dist/kalzit-$version-linux-arm64.deb" \
            --installer "linux:arm64:dist/kalzit-$version-linux-arm64.rpm" \
            --out-dir dist
      # The winget manifests for a stable release, with the MSI's address in this release and its
      # checked SHA-256, as kalzit-<version>-winget.zip in the layout of microsoft/winget-pkgs.
      # Submitting them there is a manual step (docs/operations/winget.md).
      - name: winget manifests
        shell: bash
        env:
          MSI: ${{ needs.windows-sign-msi.outputs.sha256 }}
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          case "$version" in *-*) echo "pre-release, no winget manifests"; exit 0 ;; esac
          url="https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/kalzit-$version-windows-x64.msi"
          out="$RUNNER_TEMP/winget"
          bash packaging/winget/render.sh "$version" "$url" "$MSI" "$(date -u +%F)" "$out"
          (cd "$out" && zip -r -X "$GITHUB_WORKSPACE/dist/kalzit-$version-winget.zip" manifests)
      # The release with the server binaries, the Windows installer, the deb and rpm, their signed
      # manifest and offline packages, and the signed plugin packages. Unsigned Windows files get
      # a note.
      - name: Publish
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          WINDOWS_SIGNING: ${{ needs.windows-sign-exe.outputs.mode }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          prerelease=""
          case "$version" in *-*) prerelease="--prerelease" ;; esac
          notes="$RUNNER_TEMP/notes.md"
          cp "docs/releases/v$version.md" "$notes"
          if [ "$WINDOWS_SIGNING" = "none" ]; then
            printf '\n%s\n' "> The Windows program and installer of this release are not code-signed, so Windows SmartScreen may warn before it runs them. Compare their SHA-256 with \`kalzit-$version-manifest.json\`, which is signed with Kalzit's release key." >> "$notes"
          fi
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "Kalzit $version" \
            --notes-file "$notes" \
            --verify-tag $prerelease

  # The container image for linux/amd64 and linux/arm64, pushed to ghcr.io/mousewerk/kalzit once
  # the release is published: tags <version>, and for a stable release also <major>.<minor> and
  # latest. The server is cross-compiled in the Dockerfile, so no emulation is needed. This job
  # holds only the workflow token (packages: write), never the signing key.
  #
  # The pushed image is signed in the next job (`image-sign`), which alone may ask for an OIDC
  # token; this job reports the digest it pushed.
  image:
    name: container image
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Tag on main, tags and labels
        id: meta
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # A release comes from main, or for a patch from its protected branch release/<version>.
          tag_version="${GITHUB_REF_NAME#v}"
          git fetch --no-tags origin main
          source_branch=""
          if git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then source_branch=main; fi
          if [ -z "$source_branch" ] && git fetch --no-tags origin "release/$tag_version" 2>/dev/null &&
            git merge-base --is-ancestor "$GITHUB_SHA" FETCH_HEAD; then
            source_branch="release/$tag_version"
          fi
          if [ -z "$source_branch" ]; then
            echo "::error::$GITHUB_REF_NAME does not point at a commit of main or of release/$tag_version"
            exit 1
          fi
          # A release branch must be protected like main: changes only through pull requests, with
          # the required checks, and made only by those allowed to (creation restricted), with
          # nobody bypassing its rulesets. Read with this run's read-only token.
          if [ "$source_branch" != main ]; then
            active="$(gh api --paginate "repos/$GITHUB_REPOSITORY/rules/branches/$source_branch" \
              --jq '.[] | "\(.type) \(.ruleset_id)"')" || {
              echo "::error::the rules of $source_branch cannot be read"
              exit 1
            }
            rules=" $(printf '%s\n' "$active" | cut -d' ' -f1 | tr '\n' ' ') "
            for rule in pull_request required_status_checks creation; do
              case "$rules" in
                *" $rule "*) ;;
                *)
                  echo "::error::$source_branch is not protected by the rule $rule"
                  exit 1
                  ;;
              esac
            done
            # Every ruleset that applies: no bypass actors. The list is only shown to those who
            # may edit the ruleset, so this token may see it empty; `current_user_can_bypass`
            # must say `never` as well.
            for ruleset in $(printf '%s\n' "$active" | cut -d' ' -f2 | sort -u); do
              bypass="$(gh api "repos/$GITHUB_REPOSITORY/rulesets/$ruleset" \
                --jq '"\((.bypass_actors // []) | length) \(.current_user_can_bypass // "never")"')" || {
                echo "::error::ruleset $ruleset of $source_branch cannot be read"
                exit 1
              }
              if [ "$bypass" != "0 never" ]; then
                echo "::error::ruleset $ruleset of $source_branch can be bypassed ($bypass)"
                exit 1
              fi
            done
          fi
          version="${GITHUB_REF_NAME#v}"
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/kalzit"
          tags="$image:$version"
          # <major>.<minor> and latest move only forward: a fix release for an older line (0.2.4
          # after 0.3.0) does not take them back.
          case "$version" in
            *-*) ;;
            *)
              git fetch --no-tags --force origin '+refs/tags/v*:refs/tags/v*'
              stable=$(git tag --list 'v*' | sed 's/^v//' | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' || true)
              line=$(echo "$version" | cut -d. -f1,2)
              if [ "$(printf '%s\n' "$stable" "$version" | grep "^${line//./\\.}\." | sort -V | tail -n1)" = "$version" ]; then
                tags="$tags,$image:$line"
              fi
              if [ "$(printf '%s\n' "$stable" "$version" | sort -V | tail -n1)" = "$version" ]; then
                tags="$tags,$image:latest"
              fi
              ;;
          esac
          echo "Tags: $tags"
          {
            echo "version=$version"
            echo "tags=$tags"
            echo "commit=$(git rev-parse --short=9 HEAD)"
            echo "date=$(date -u -d "@$(git show -s --format=%ct HEAD)" +%F)"
            echo "created=$(git show -s --format=%cI HEAD)"
          } >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        id: build
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          sbom: true
          provenance: mode=max
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
            REVISION=${{ github.sha }}
            CREATED=${{ steps.meta.outputs.created }}
            KALZIT_BUILD_COMMIT=${{ steps.meta.outputs.commit }}
            KALZIT_BUILD_DATE=${{ steps.meta.outputs.date }}
            KALZIT_UPDATE_PUBLIC_KEYS=${{ vars.KALZIT_UPDATE_PUBLIC_KEYS }}
          cache-from: type=gha,scope=kalzit-image-release
          cache-to: type=gha,scope=kalzit-image-release,mode=max

  # Signs the image `image` pushed with cosign, keyless: the job's OIDC token (id-token: write) gets
  # a short-lived certificate from Sigstore's Fulcio that names this workflow file and the tag; the
  # signature goes to the registry next to the image and into Sigstore's public transparency log
  # (Rekor). No key exists to keep or leak; docs/guide/installation.md says how to verify. The job
  # builds nothing and checks out nothing: it signs exactly the digest `image` reported.
  image-sign:
    name: sign container image
    needs: image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      packages: write
      id-token: write
    env:
      DIGEST: ${{ needs.image.outputs.digest }}
    steps:
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      # cosign 3.0.6, which the installer checks against the SHA-256 in the action itself.
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.0.6
      # By digest, never by tag, so exactly the pushed image is signed: the index and, with
      # --recursive, each platform's image in it.
      - name: Sign the image
        shell: bash
        run: |
          set -euo pipefail
          [[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          cosign sign --yes --recursive "ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/kalzit@$DIGEST"
      # As a user checks it (docs/guide/installation.md, "Checking the image's signature"): the
      # certificate must name this workflow at this tag.
      - name: Verify the signature
        shell: bash
        run: |
          cosign verify "ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/kalzit@$DIGEST" \
            --certificate-identity "https://github.com/${GITHUB_REPOSITORY}/.github/workflows/release.yml@${GITHUB_REF}" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com > /dev/null
          echo "signed: ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/kalzit@$DIGEST"

  # The signed image as one gzip-compressed docker-archive per processor, for everyone without
  # access to the private package on ghcr.io and for servers that cannot reach it:
  # kalzit-<version>-image-linux-amd64.tar.gz and -linux-arm64.tar.gz, which `docker load` and
  # `podman load` read, plus kalzit-<version>-image-SHA256SUMS with its cosign signature
  # (kalzit-<version>-image-SHA256SUMS.sigstore.json). Three jobs, each with only what it needs:
  #
  # - `image-archive` runs after `image-sign`, checks the image's cosign signature itself and then
  #   archives exactly the digest `image` pushed (.github/scripts/image-archive.sh: platform image
  #   by digest, copied with skopeo, loaded, checked and run). Each leg runs on a runner of its
  #   processor, so nothing is emulated. It may read packages, nothing else.
  # - `image-archive-sign` writes the checksum file from the hashes the legs reported and signs it
  #   with cosign, keyless like `image-sign`; besides `image-sign` it is the only job that may ask
  #   for an OIDC token. It builds nothing, checks out nothing and cannot write to the release.
  # - `image-archive-publish` checks the archives against the signed checksum file and adds all
  #   four files to the release; it may only do that.
  #
  # None of them has the release signing key. The signed update manifest is written before the
  # image exists and does not list the archives; docs/guide/installation.md says how to check
  # them. A dry run of the archive step: .github/workflows/image-archive-dry-run.yml.
  image-archive:
    name: image archive (linux-${{ matrix.arch }})
    needs: [image, image-sign]
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: ubuntu-latest
            arch: amd64
          - os: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    permissions:
      contents: read
      packages: read
    # The archive's SHA-256 per processor; a leg leaves the other's output empty, which does not
    # overwrite it.
    outputs:
      sha256-amd64: ${{ steps.archive.outputs.sha256-amd64 }}
      sha256-arm64: ${{ steps.archive.outputs.sha256-arm64 }}
    env:
      DIGEST: ${{ needs.image.outputs.digest }}
      ARCH: ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.0.6
      # The same check as at the end of `image-sign`, here again so nothing unsigned is archived.
      - name: Check the signature
        shell: bash
        run: |
          set -euo pipefail
          [[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          cosign verify "ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/kalzit@$DIGEST" \
            --certificate-identity "https://github.com/${GITHUB_REPOSITORY}/.github/workflows/release.yml@${GITHUB_REF}" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com > /dev/null
      # skopeo comes with the x64 runner image; the arm64 one may lack it, then it comes from the
      # same Ubuntu release's archive. The script refuses versions older than 1.13.
      - name: skopeo
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v skopeo > /dev/null; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends skopeo
          fi
          skopeo --version
      - name: Archive and check
        id: archive
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          .github/scripts/image-archive.sh "ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/kalzit" "$DIGEST" "$ARCH" "$version" dist | tee "$RUNNER_TEMP/archive.log"
          echo "sha256-$ARCH=$(sed -n 's/^sha256=//p' "$RUNNER_TEMP/archive.log" | tail -n1)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: kalzit-image-archive-${{ matrix.arch }}
          path: dist/
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  # Signs the checksum file of both archives with cosign, keyless through the job's OIDC token,
  # with the same workflow identity as `image-sign`. It needs no archive: the checksum file is
  # written from the hashes the legs reported, and `image-archive-publish` checks the archives
  # against it.
  image-archive-sign:
    name: sign image archive checksums
    needs: image-archive
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      id-token: write
    env:
      AMD64: ${{ needs.image-archive.outputs.sha256-amd64 }}
      ARM64: ${{ needs.image-archive.outputs.sha256-arm64 }}
    steps:
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.0.6
      - name: Checksum file
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          [[ "$AMD64" =~ ^[0-9a-f]{64}$ ]]
          [[ "$ARM64" =~ ^[0-9a-f]{64}$ ]]
          mkdir sums
          printf '%s  %s\n' "$AMD64" "kalzit-$version-image-linux-amd64.tar.gz" \
            "$ARM64" "kalzit-$version-image-linux-arm64.tar.gz" > "sums/kalzit-$version-image-SHA256SUMS"
          cat "sums/kalzit-$version-image-SHA256SUMS"
      - name: Sign the checksum file
        shell: bash
        run: |
          set -euo pipefail
          sums="sums/kalzit-${GITHUB_REF_NAME#v}-image-SHA256SUMS"
          cosign sign-blob --yes --bundle "$sums.sigstore.json" "$sums" > /dev/null
      # As a user checks it (docs/guide/installation.md, "Loading the image from the release").
      - name: Verify the signature
        shell: bash
        run: |
          set -euo pipefail
          sums="sums/kalzit-${GITHUB_REF_NAME#v}-image-SHA256SUMS"
          cosign verify-blob --bundle "$sums.sigstore.json" \
            --certificate-identity "https://github.com/${GITHUB_REPOSITORY}/.github/workflows/release.yml@${GITHUB_REF}" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            "$sums"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: kalzit-image-archive-sums
          path: sums/
          if-no-files-found: error
          retention-days: 7

  # Adds the archives, the checksum file and its signature to the release, all four only after
  # every check passed. A re-run (after a network failure, say) finishes the set: a file already
  # in the release with the expected SHA-256 is skipped, one with another SHA-256 fails the job,
  # and nothing is ever replaced. Holds nothing but `contents: write`.
  image-archive-publish:
    name: publish image archives
    needs: [image-archive, image-archive-sign]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: kalzit-image-archive-amd64
          path: dist
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: kalzit-image-archive-arm64
          path: dist
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: kalzit-image-archive-sums
          path: dist
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.0.6
      - name: Check the downloads
        shell: bash
        env:
          AMD64: ${{ needs.image-archive.outputs.sha256-amd64 }}
          ARM64: ${{ needs.image-archive.outputs.sha256-arm64 }}
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          sums="kalzit-$version-image-SHA256SUMS"
          [[ "$AMD64" =~ ^[0-9a-f]{64}$ ]]
          [[ "$ARM64" =~ ^[0-9a-f]{64}$ ]]
          cd dist
          cosign verify-blob --bundle "$sums.sigstore.json" \
            --certificate-identity "https://github.com/${GITHUB_REPOSITORY}/.github/workflows/release.yml@${GITHUB_REF}" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            "$sums"
          printf '%s  %s\n' "$AMD64" "kalzit-$version-image-linux-amd64.tar.gz" \
            "$ARM64" "kalzit-$version-image-linux-arm64.tar.gz" | cmp - "$sums"
          sha256sum -c "$sums"
          test "$(find . -mindepth 1 -maxdepth 1 | wc -l)" -eq 4
      - name: Upload to the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          # name<TAB>digest of every asset already in the release; the digest is empty for assets
          # GitHub has not hashed, which are then downloaded and hashed here.
          release_id=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$GITHUB_REF_NAME" --jq .id)
          existing="$RUNNER_TEMP/existing.tsv"
          gh api --paginate "repos/$GITHUB_REPOSITORY/releases/$release_id/assets?per_page=100" \
            --jq '.[] | [.name, (.digest // "")] | @tsv' > "$existing"
          upload=()
          for name in "kalzit-$version-image-linux-amd64.tar.gz" "kalzit-$version-image-linux-arm64.tar.gz" \
            "kalzit-$version-image-SHA256SUMS" "kalzit-$version-image-SHA256SUMS.sigstore.json"; do
            expected="sha256:$(sha256sum "dist/$name" | cut -d' ' -f1)"
            found=$(awk -F '\t' -v n="$name" '$1 == n { print $2; seen = 1 } END { if (!seen) print "-" }' "$existing")
            if [ "$found" = "-" ]; then
              upload+=("dist/$name")
              continue
            fi
            if [ -z "$found" ]; then
              mkdir -p "$RUNNER_TEMP/present"
              gh release download "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
                --pattern "$name" --dir "$RUNNER_TEMP/present" --clobber
              found="sha256:$(sha256sum "$RUNNER_TEMP/present/$name" | cut -d' ' -f1)"
            fi
            if [ "$found" != "$expected" ]; then
              echo "::error::$name is already in the release with $found, expected $expected"
              exit 1
            fi
            echo "$name is already in the release, unchanged"
          done
          if [ "${#upload[@]}" -gt 0 ]; then
            gh release upload "$GITHUB_REF_NAME" "${upload[@]}" --repo "$GITHUB_REPOSITORY"
          fi
