name: CI

on:
  push:
    branches: [main]
  pull_request:
  # The merge queue tests each queued pull request on top of main before it merges.
  merge_group:
    types: [checks_requested]

concurrency:
  group: ci-${{ github.ref }}
  # A newer push to a pull request replaces its run; runs on main and in the queue all finish.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

# Which jobs run: on a pull request only those for the areas it changes (job `changes`, rules in
# .github/scripts/changes.sh and docs/ARCHITECTURE.md, "CI"); on main and in the merge queue all
# of them. A job without work still reports its check: the matrix jobs (server, plugins, ui,
# e2e) run and skip their steps, because a matrix job skipped as a whole reports no check per
# matrix value; the other jobs are skipped as a whole, which counts as passed. If `changes`
# fails, everything runs.
jobs:
  changes:
    name: changes
    runs-on: ubuntu-latest
    outputs:
      server: ${{ steps.areas.outputs.server }}
      ui: ${{ steps.areas.outputs.ui }}
      e2e: ${{ steps.areas.outputs.e2e }}
      audit: ${{ steps.areas.outputs.audit }}
      docker: ${{ steps.areas.outputs.docker }}
      installer: ${{ steps.areas.outputs.installer }}
    steps:
      # A pull request checks out its merge commit with main, whose first parent is main.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - name: Test the change detection
        run: .github/scripts/changes.test.sh
      # The log also shows the informational flags workflows and docs_only.
      - name: Changed areas
        id: areas
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$EVENT" = pull_request ]; then
            echo "Changed files:"
            .github/scripts/changes.sh HEAD^1 HEAD | tee -a "$GITHUB_OUTPUT"
          else
            echo "Event $EVENT: everything runs."
            .github/scripts/changes.sh < /dev/null | tee -a "$GITHUB_OUTPUT"
          fi

  server:
    name: server (${{ matrix.os }})
    needs: changes
    if: ${{ !cancelled() }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      RUN_JOB: ${{ needs.changes.result != 'success' || needs.changes.outputs.server == 'true' }}
    steps:
      - name: Nothing to check
        if: env.RUN_JOB != 'true'
        run: echo "No server change in this pull request; the checks are skipped."
      - uses: actions/checkout@v7
        if: env.RUN_JOB == 'true'
      - uses: dtolnay/rust-toolchain@stable
        if: env.RUN_JOB == 'true'
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        if: env.RUN_JOB == 'true'
        with:
          save-if: ${{ github.event_name != 'merge_group' }}
      - if: env.RUN_JOB == 'true'
        run: cargo fmt --all --check
      - if: env.RUN_JOB == 'true'
        run: cargo clippy --locked --all-targets -- -D warnings
      - if: env.RUN_JOB == 'true'
        run: cargo test --locked

  # The example plugins (examples/plugins), built, packaged and signed per system the way a
  # release does (release.yml, jobs `plugin-*`), but with a throwaway key made in the job: pull
  # requests never see Kalzit's plugin key. The packages are then checked against that key.
  plugins:
    name: plugins (${{ matrix.os }})
    needs: changes
    if: ${{ !cancelled() }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux-x64
            exe: ""
          - os: windows-latest
            platform: windows-x64
            exe: .exe
    runs-on: ${{ matrix.os }}
    env:
      RUN_JOB: ${{ needs.changes.result != 'success' || needs.changes.outputs.server == 'true' }}
    steps:
      - name: Nothing to check
        if: env.RUN_JOB != 'true'
        run: echo "No server change in this pull request; the plugin packages are skipped."
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        if: env.RUN_JOB == 'true'
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch, 2026-10
        if: env.RUN_JOB == 'true'
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        if: env.RUN_JOB == 'true'
        with:
          key: plugins
          save-if: ${{ github.event_name != 'merge_group' }}
      - if: env.RUN_JOB == 'true'
        run: cargo build --release --locked -p kalzit-csv-http -p kalzit-plugin-tool -p kalzit-release
      # The release's steps: packages built unsigned, their manifests signed by kalzit-sign (here
      # with a throwaway key in place of the release environment's), the signatures attached and
      # checked.
      - name: Package, sign with a throwaway key, attach and verify
        if: env.RUN_JOB == 'true'
        shell: bash
        env:
          PLATFORM: ${{ matrix.platform }}
          EXE: ${{ matrix.exe }}
          # A base64 public key can start with "/", which Git Bash on Windows would turn into a path.
          MSYS_NO_PATHCONV: "1"
        run: |
          set -euo pipefail
          tool="target/release/kalzit-plugin$EXE"
          key="$RUNNER_TEMP/throwaway-plugin-key"
          public="$("$tool" keygen --out "$key" | sed -n 's/^public key: //p')"
          test -n "$public"
          mkdir -p dist
          "$tool" package --manifest examples/plugins/csv-http/kalzit-plugin.toml \
            --file "bin/$PLATFORM/kalzit-csv-http$EXE=target/release/kalzit-csv-http$EXE" \
            --file README.md=examples/plugins/csv-http/README.md \
            --platform "$PLATFORM" --unsigned \
            --out dist/csv-http.zip --manifest-out dist/csv-http.toml
          "$tool" package --manifest examples/plugins/panel-kpi/kalzit-plugin.toml \
            --file panel.js=examples/plugins/panel-kpi/panel.js \
            --file README.md=examples/plugins/panel-kpi/README.md \
            --unsigned --out dist/panel-kpi.zip --manifest-out dist/panel-kpi.toml
          KALZIT_PLUGIN_SIGNING_KEY="$(cat "$key")" "target/release/kalzit-sign$EXE" sign-plugin-manifest \
            --manifest dist/csv-http.toml --manifest dist/panel-kpi.toml
          rm -f "$key"
          for name in csv-http panel-kpi; do
            "$tool" attach-signature --package "dist/$name.zip" --signature "dist/$name.toml.sig" \
              --public-key "$public"
            "$tool" verify --package "dist/$name.zip" --public-key "$public"
          done

  postgres:
    name: postgres
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.server == 'true') }}
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: kalzit
          POSTGRES_DB: kalzit
          # A throwaway container reachable only from this job; no password to leak or flag.
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U kalzit" --health-interval 2s --health-timeout 5s --health-retries 20
    env:
      KALZIT_TEST_POSTGRES_URL: postgres://kalzit@localhost:5432/kalzit
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.event_name != 'merge_group' }}
      - run: cargo test --locked --test api --test access --test explore_history --test team_spaces --test cluster postgres -- --nocapture

  # The privilege switch of `kalzit update apply|rollback` (server/tests/update_rights.rs): run as
  # root on a data directory a service account owns, which needs sudo, so it is ignored elsewhere.
  update-rights:
    name: update rights (sudo)
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.server == 'true') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.event_name != 'merge_group' }}
      - name: Build the test as the runner user
        id: build
        shell: bash
        run: |
          cargo test --locked -p kalzit --test update_rights --no-run 2>&1 | tee build.log
          binary="$(grep -oE 'target/debug/deps/update_rights-[0-9a-f]+' build.log | head -1)"
          test -x "$binary"
          echo "binary=$binary" >> "$GITHUB_OUTPUT"
      - name: A service account and its private data directory
        run: |
          sudo useradd --system --no-create-home --shell /usr/sbin/nologin kalzit
          sudo install -d -o kalzit -g kalzit -m 0700 /var/lib/kalzit-rights-test
      - name: Run the test as root
        env:
          KALZIT_TEST_RIGHTS_DIR: /var/lib/kalzit-rights-test
        run: sudo env KALZIT_TEST_RIGHTS_DIR="$KALZIT_TEST_RIGHTS_DIR" "${{ steps.build.outputs.binary }}" --ignored --test-threads=1 --nocapture

  # Data sources against real servers. The passwords below belong to throwaway containers
  # reachable only from this job; they protect nothing and are not secrets. PostgreSQL uses a
  # password here (unlike the job above) so password handling and scrubbing are exercised.
  datasources:
    name: datasources
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.server == 'true') }}
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: kalzit
          POSTGRES_PASSWORD: kalzit-ci-pg
          POSTGRES_DB: kalzit
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U kalzit" --health-interval 2s --health-timeout 5s --health-retries 30
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: kalzit-ci-mysql
          MYSQL_DATABASE: kalzit
        ports: ["3306:3306"]
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -uroot -pkalzit-ci-mysql"
          --health-interval 2s --health-timeout 5s --health-retries 60
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: kalzit-ci-mariadb
          MARIADB_DATABASE: kalzit
        ports: ["3307:3306"]
        options: >-
          --health-cmd "healthcheck.sh --connect --innodb_initialized"
          --health-interval 2s --health-timeout 5s --health-retries 60
      mssql:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: "Kalzit-CI-mssql-1"
        ports: ["1433:1433"]
      prometheus:
        image: prom/prometheus:v3.5.0
        ports: ["9090:9090"]
      # Security on (basic auth over plain HTTP), so credentials and scrubbing are exercised.
      elasticsearch:
        image: docker.elastic.co/elasticsearch/elasticsearch:9.5.5
        env:
          discovery.type: single-node
          xpack.security.enabled: "true"
          xpack.security.http.ssl.enabled: "false"
          ELASTIC_PASSWORD: kalzit-ci-es
          cluster.routing.allocation.disk.threshold_enabled: "false"
          ES_JAVA_OPTS: -Xms512m -Xmx512m
        ports: ["9200:9200"]
      # The security plugin is off: the test covers a cluster without authentication.
      opensearch:
        image: opensearchproject/opensearch:3.9.0
        env:
          discovery.type: single-node
          DISABLE_SECURITY_PLUGIN: "true"
          DISABLE_INSTALL_DEMO_CONFIG: "true"
          cluster.routing.allocation.disk.threshold_enabled: "false"
          OPENSEARCH_JAVA_OPTS: -Xms512m -Xmx512m
        ports: ["9201:9200"]
      neo4j:
        image: neo4j:2026.10.0-community
        env:
          NEO4J_AUTH: neo4j/kalzit-ci-neo4j
        ports: ["7687:7687"]
      memgraph:
        image: memgraph/memgraph:3.14.0
        ports: ["7688:7687"]
      mongodb:
        image: mongo:8.2
        env:
          MONGO_INITDB_ROOT_USERNAME: kalzit
          MONGO_INITDB_ROOT_PASSWORD: kalzit-ci-mongo
        ports: ["27017:27017"]
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ ping: 1 }).ok'"
          --health-interval 2s --health-timeout 5s --health-retries 30
      clickhouse:
        image: clickhouse/clickhouse-server:25.8
        env:
          CLICKHOUSE_USER: kalzit
          CLICKHOUSE_PASSWORD: kalzit-ci-clickhouse
          CLICKHOUSE_DB: kalzit
          CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
        ports: ["8123:8123"]
      # 2.x with a first user, organization, bucket and token; InfluxDB 3 Core starts in a step
      # below, as it needs its own command.
      influxdb2:
        image: influxdb:2.7
        env:
          DOCKER_INFLUXDB_INIT_MODE: setup
          DOCKER_INFLUXDB_INIT_USERNAME: kalzit
          DOCKER_INFLUXDB_INIT_PASSWORD: kalzit-ci-influx
          DOCKER_INFLUXDB_INIT_ORG: kalzit
          DOCKER_INFLUXDB_INIT_BUCKET: kalzit
          DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: kalzit-ci-influx-token
        ports: ["8086:8086"]
      loki:
        image: grafana/loki:3.5.0
        ports: ["3100:3100"]
    env:
      KALZIT_TEST_REQUIRE_DATABASES: "1"
      KALZIT_TEST_POSTGRES_URL: postgres://kalzit:kalzit-ci-pg@localhost:5432/kalzit
      KALZIT_TEST_MYSQL_URL: mysql://root:kalzit-ci-mysql@127.0.0.1:3306/kalzit
      KALZIT_TEST_MARIADB_URL: mysql://root:kalzit-ci-mariadb@127.0.0.1:3307/kalzit
      KALZIT_TEST_MSSQL_URL: mssql://sa:Kalzit-CI-mssql-1@127.0.0.1:1433/master
      KALZIT_TEST_PROMETHEUS_URL: http://127.0.0.1:9090
      KALZIT_TEST_ELASTICSEARCH_URL: http://elastic:kalzit-ci-es@127.0.0.1:9200
      KALZIT_TEST_OPENSEARCH_URL: http://127.0.0.1:9201
      KALZIT_TEST_NEO4J_URL: bolt://neo4j:kalzit-ci-neo4j@127.0.0.1:7687
      KALZIT_TEST_MEMGRAPH_URL: bolt://127.0.0.1:7688
      KALZIT_TEST_MONGODB_URL: mongodb://kalzit:kalzit-ci-mongo@127.0.0.1:27017/?authSource=admin
      KALZIT_TEST_CLICKHOUSE_URL: http://kalzit:kalzit-ci-clickhouse@127.0.0.1:8123/kalzit
      KALZIT_TEST_INFLUXDB2_URL: http://kalzit:kalzit-ci-influx-token@127.0.0.1:8086/kalzit
      KALZIT_TEST_INFLUXDB3_URL: http://127.0.0.1:8181/kalzit
      KALZIT_TEST_LOKI_URL: http://127.0.0.1:3100
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.event_name != 'merge_group' }}
      - name: Start InfluxDB 3 Core
        run: >-
          docker run -d --name influxdb3 -p 8181:8181 influxdb:3-core
          influxdb3 serve --node-id ci --object-store memory --without-auth
      - run: cargo build --locked --tests
      - name: Wait for SQL Server, Prometheus, Elasticsearch, OpenSearch, Neo4j, Memgraph, ClickHouse, InfluxDB and Loki
        shell: bash
        run: |
          for i in $(seq 1 120); do
            if docker exec "${{ job.services.mssql.id }}" /opt/mssql-tools18/bin/sqlcmd -C -S localhost \
                 -U sa -P "Kalzit-CI-mssql-1" -Q "SELECT 1" > /dev/null 2>&1; then
              mssql=ok
            fi
            if curl -fs http://127.0.0.1:9090/-/ready > /dev/null; then prom=ok; fi
            if curl -fs -u elastic:kalzit-ci-es \
                 "http://127.0.0.1:9200/_cluster/health?wait_for_status=yellow&timeout=1s" > /dev/null; then
              es=ok
            fi
            if curl -fs "http://127.0.0.1:9201/_cluster/health?wait_for_status=yellow&timeout=1s" > /dev/null; then
              os=ok
            fi
            if docker exec "${{ job.services.neo4j.id }}" cypher-shell -u neo4j -p kalzit-ci-neo4j "RETURN 1" > /dev/null 2>&1; then neo4j=ok; fi
            if timeout 1 bash -c "</dev/tcp/127.0.0.1/7688" 2> /dev/null; then memgraph=ok; fi
            if curl -fs http://127.0.0.1:8123/ping > /dev/null; then clickhouse=ok; fi
            if curl -fs http://127.0.0.1:8086/health > /dev/null; then influx2=ok; fi
            if curl -fs http://127.0.0.1:8181/health > /dev/null; then influx3=ok; fi
            if curl -fs http://127.0.0.1:3100/ready > /dev/null; then loki=ok; fi
            if [ "${mssql:-}" = ok ] && [ "${prom:-}" = ok ] && [ "${es:-}" = ok ] && [ "${os:-}" = ok ] \
                 && [ "${neo4j:-}" = ok ] && [ "${memgraph:-}" = ok ] && [ "${clickhouse:-}" = ok ] \
                 && [ "${influx2:-}" = ok ] && [ "${influx3:-}" = ok ] && [ "${loki:-}" = ok ]; then
              exit 0
            fi
            sleep 2
          done
          docker logs influxdb3 >&2 || true
          echo "SQL Server, Prometheus, Elasticsearch, OpenSearch, Neo4j, Memgraph, ClickHouse, InfluxDB or Loki did not become ready" >&2
          exit 1
      - run: cargo test --locked --test datasources -- --nocapture
      - run: cargo test --locked --test mongodb -- --nocapture

  ui:
    name: ui (${{ matrix.os }})
    needs: changes
    if: ${{ !cancelled() }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    # A fixed zone, so tests about time zones cannot pass by the runner's accident.
    env:
      TZ: UTC
      RUN_JOB: ${{ needs.changes.result != 'success' || needs.changes.outputs.ui == 'true' }}
    defaults:
      run:
        working-directory: ui
    steps:
      - name: Nothing to check
        if: env.RUN_JOB != 'true'
        working-directory: .
        run: echo "No UI change in this pull request; the checks are skipped."
      - uses: actions/checkout@v7
        if: env.RUN_JOB == 'true'
      - name: Check for the UI
        if: env.RUN_JOB == 'true'
        id: has_ui
        shell: bash
        working-directory: .
        run: echo "present=$([ -f ui/package.json ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v7
        if: steps.has_ui.outputs.present == 'true'
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - if: steps.has_ui.outputs.present == 'true'
        run: npm ci
      - if: steps.has_ui.outputs.present == 'true'
        run: npm run format:check
      - if: steps.has_ui.outputs.present == 'true'
        run: npm run lint
      - if: steps.has_ui.outputs.present == 'true'
        run: npm run check
      - if: steps.has_ui.outputs.present == 'true'
        run: npm run typecheck
      - if: steps.has_ui.outputs.present == 'true'
        run: npm test
      - name: Tests in a zone with daylight saving time
        if: steps.has_ui.outputs.present == 'true' && runner.os == 'Linux'
        env:
          TZ: America/New_York
        run: npm test
      # This job checks the UI only: the license lists need cargo (the e2e and release builds
      # make them strictly), so here the build may do without.
      - if: steps.has_ui.outputs.present == 'true'
        run: npm run build
        env:
          KALZIT_LICENSES_STRICT: "0"

  # End-to-end tests against the server binary with the embedded UI (ui/e2e), built with the
  # e2e profile (release settings, less optimization, so it builds faster). Not a required check
  # yet.
  e2e:
    name: e2e (${{ matrix.os }})
    needs: changes
    if: ${{ !cancelled() }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    # A run takes 5 (Linux) to 10 minutes (Windows), about twice that with a cold build cache;
    # the steps that download have their own, shorter limits.
    timeout-minutes: 30
    env:
      KALZIT_E2E_BINARY: ${{ github.workspace }}/target/e2e/kalzit${{ matrix.os == 'windows-latest' && '.exe' || '' }}
      # The test plugin of the server's contract tests, packaged by ui/e2e/plugins.spec.ts.
      KALZIT_E2E_PLUGIN_BINARY: ${{ github.workspace }}/target/e2e/kalzit-test-plugin${{ matrix.os == 'windows-latest' && '.exe' || '' }}
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.playwright-browsers
      RUN_JOB: ${{ needs.changes.result != 'success' || needs.changes.outputs.e2e == 'true' }}
    steps:
      - name: Nothing to check
        if: env.RUN_JOB != 'true'
        run: echo "No server or UI change in this pull request; the end-to-end tests are skipped."
      - uses: actions/checkout@v7
        if: env.RUN_JOB == 'true'
      # MongoDB, OpenSearch, Neo4j and Memgraph for the document, search and graph specs, started
      # first so they are up once the build is done. Linux only: Windows runners have no Linux
      # containers, so those specs skip there with a reason, and the release's Windows checklist
      # covers them.
      - name: Start MongoDB, OpenSearch, Neo4j and Memgraph
        if: env.RUN_JOB == 'true' && runner.os == 'Linux'
        timeout-minutes: 5
        run: .github/scripts/e2e-services.sh start
      - uses: actions/setup-node@v7
        if: env.RUN_JOB == 'true'
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        if: env.RUN_JOB == 'true'
      - uses: Swatinem/rust-cache@v2
        if: env.RUN_JOB == 'true'
        with:
          key: e2e-profile
          save-if: ${{ github.event_name != 'merge_group' }}
      - run: npm ci
        if: env.RUN_JOB == 'true'
        working-directory: ui
      # Strict (CI is set): the license lists of the bundle need cargo, which is installed above.
      - run: npm run build
        if: env.RUN_JOB == 'true'
        working-directory: ui
      - run: cargo build --profile e2e --locked -p kalzit -p kalzit-test-plugin
        if: env.RUN_JOB == 'true'
      # The browsers belong to the Playwright version, so other dependency updates keep the cache.
      - name: Playwright version
        if: env.RUN_JOB == 'true'
        id: playwright
        working-directory: ui
        shell: bash
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      # A merge queue run restores the browsers but does not save, since its cache would be its own.
      - name: Restore Playwright browsers
        if: env.RUN_JOB == 'true'
        id: browsers
        uses: actions/cache/restore@v6
        with:
          path: .playwright-browsers
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - name: Install Playwright browsers
        if: env.RUN_JOB == 'true' && steps.browsers.outputs.cache-hit != 'true'
        timeout-minutes: 10
        working-directory: ui
        shell: bash
        run: |
          for attempt in 1 2 3; do
            npx playwright install chromium firefox webkit && exit 0
            echo "::warning::installing the browsers failed (attempt $attempt of 3)"
          done
          exit 1
      - name: Save Playwright browsers
        if: >-
          env.RUN_JOB == 'true' && steps.browsers.outputs.cache-hit != 'true'
          && github.event_name != 'merge_group'
        uses: actions/cache/save@v6
        with:
          path: .playwright-browsers
          key: ${{ steps.browsers.outputs.cache-primary-key }}
      # The system packages (about 190, 140 MB, most of them WebKit's and Firefox's media
      # libraries) come from the runner's package mirror, which sometimes slows to a few kB/s
      # without failing. They are kept between runs per runner image, so apt downloads only what
      # changed; .github/scripts/browser-deps.sh retries with a limit per attempt and moves to
      # the main Ubuntu archive. Its test runs first, so a broken retry shows before it is needed.
      # A merge queue run restores them but does not save, since its cache would be its own.
      - name: Test the browser package install script
        if: env.RUN_JOB == 'true' && runner.os == 'Linux'
        run: .github/scripts/browser-deps.test.sh
      - name: Runner image
        if: env.RUN_JOB == 'true' && runner.os == 'Linux'
        id: image
        run: echo "name=$ImageOS-$ImageVersion" >> "$GITHUB_OUTPUT"
      - name: Restore browser system packages
        if: env.RUN_JOB == 'true' && runner.os == 'Linux'
        id: debs
        uses: actions/cache/restore@v6
        with:
          path: ~/.cache/kalzit-browser-debs
          key: browser-debs-${{ steps.image.outputs.name }}-playwright-${{ steps.playwright.outputs.version }}
          restore-keys: browser-debs-
      - name: Install browser system packages
        if: env.RUN_JOB == 'true' && runner.os == 'Linux'
        timeout-minutes: 12
        working-directory: ui
        run: |
          DEPS_CACHE="$HOME/.cache/kalzit-browser-debs" ../.github/scripts/browser-deps.sh \
            node node_modules/@playwright/test/cli.js install-deps chromium firefox webkit
      - name: Save browser system packages
        if: >-
          env.RUN_JOB == 'true' && runner.os == 'Linux' && steps.debs.outputs.cache-hit != 'true'
          && github.event_name != 'merge_group'
        uses: actions/cache/save@v6
        with:
          path: ~/.cache/kalzit-browser-debs
          key: ${{ steps.debs.outputs.cache-primary-key }}
      # Seeds MongoDB (ui/e2e/fixtures/mongo-orders.js), Neo4j and Memgraph
      # (ui/e2e/fixtures/graph-shop.cypher) and names the services for the specs.
      - name: Wait for MongoDB, OpenSearch, Neo4j and Memgraph
        if: env.RUN_JOB == 'true' && runner.os == 'Linux'
        timeout-minutes: 5
        run: .github/scripts/e2e-services.sh ready
      # Windows: a page load failed with net::ERR_NO_BUFFER_SPACE in about a third of the runs
      # (Winsock WSAENOBUFS on connect, one request of a burst, at any time in the run). The
      # runner's dynamic port range is 49152 to 65535 (16,384 ports), and the run leaves up to
      # 1,070 loopback connections in TIME_WAIT (each closed browser context's connections, held
      # for minutes). Chromium on Windows 11 22H2 and later picks a random source port
      # (TcpPortRandomizationWin); the likely cause is a pick that meets a port still in TIME_WAIT
      # towards the same server. A range more than three times as large makes such a pick that
      # much rarer. It starts at 10000, clear of the service ports below it (WinRM 5985 and 5986,
      # and the like); a port in use or excluded (47001 on the runner) is never handed out. The
      # watch records the counts, so a failure can be read against them; it pauses while the
      # performance budgets run (KALZIT_E2E_QUIET_FILE), so it adds no CPU load to them.
      - name: Widen the dynamic port range
        if: env.RUN_JOB == 'true' && runner.os == 'Windows'
        run: netsh int ipv4 set dynamicport tcp start=10000 num=55535
      - name: Watch TCP connections
        if: env.RUN_JOB == 'true' && runner.os == 'Windows'
        shell: pwsh
        run: .github/scripts/tcp-watch.ps1 start
      - run: npm run e2e
        if: env.RUN_JOB == 'true'
        timeout-minutes: 15
        working-directory: ui
        env:
          KALZIT_E2E_QUIET_FILE: ${{ runner.os == 'Windows' && format('{0}/tcp-watch.pause', runner.temp) || '' }}
      - name: TCP connections during the run
        if: ${{ !cancelled() && env.RUN_JOB == 'true' && runner.os == 'Windows' }}
        shell: pwsh
        run: .github/scripts/tcp-watch.ps1 report
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !success() }}
        with:
          name: e2e-${{ matrix.os }}
          path: ui/e2e/.output
          if-no-files-found: ignore
          # .output starts with a dot; without this the traces and screenshots are left out.
          include-hidden-files: true
          retention-days: 14

  # The Windows installer (packaging/windows): the MSI package built as the release builds it
  # (with the faster e2e profile), then installed on the runner, which is thrown away afterwards:
  # service running as NT SERVICE\Kalzit, HTTP health, data folder access, firewall rule,
  # recovery after a crash, graceful stop, uninstall with and without the data, and the same
  # through `kalzit service install|uninstall` (.github/scripts/msi-test.ps1).
  msi:
    name: msi (windows-latest)
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.installer == 'true') }}
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch, 2026-10
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: msi
          save-if: ${{ github.event_name != 'merge_group' }}
      # The health check needs no web interface, so the UI is not built here.
      - run: cargo build --profile e2e --locked -p kalzit --bin kalzit
      - name: Install WiX
        run: |
          dotnet tool install --global wix --version 5.0.2
          wix extension add --global WixToolset.UI.wixext/5.0.2
      - name: Build the MSI package
        shell: pwsh
        run: |
          $version = (Select-String -Path server/Cargo.toml -Pattern '^version = "(.+)"' | Select-Object -First 1).Matches[0].Groups[1].Value
          ./packaging/windows/build.ps1 -Exe target/e2e/kalzit.exe -Version $version -Out dist/kalzit-ci-windows-x64.msi
          ./packaging/windows/check-msi.ps1 -Msi dist/kalzit-ci-windows-x64.msi -Exe target/e2e/kalzit.exe
          # A next version, for the upgrade from the English installation with the German transform.
          $parts = ($version -replace '[-+].*$', '').Split('.')
          $next = "$($parts[0]).$($parts[1]).$([int]$parts[2] + 1)"
          ./packaging/windows/build.ps1 -Exe target/e2e/kalzit.exe -Version $next -Out dist/kalzit-ci-next-windows-x64.msi
      - name: Install, check and uninstall
        shell: pwsh
        run: ./.github/scripts/msi-test.ps1 -Msi dist/kalzit-ci-windows-x64.msi -UpgradeMsi dist/kalzit-ci-next-windows-x64.msi -Exe target/e2e/kalzit.exe -Logs "$env:RUNNER_TEMP/msi-logs"
      - name: Collect the logs
        if: failure()
        shell: pwsh
        run: |
          $logs = "$env:RUNNER_TEMP/msi-logs"
          New-Item -ItemType Directory -Force $logs | Out-Null
          $data = Join-Path $env:ProgramData 'Kalzit\data\logs'
          if (Test-Path $data) { Copy-Item -Recurse $data (Join-Path $logs 'kalzit') }
          # No event of a source is an error for Get-WinEvent.
          try {
            Get-WinEvent -FilterHashtable @{ LogName = 'Application' } -MaxEvents 500 -ErrorAction Stop |
              Where-Object { $_.ProviderName -eq 'Kalzit' } |
              ForEach-Object { "$($_.TimeCreated) $($_.Properties | ForEach-Object { $_.Value })" } | Out-File (Join-Path $logs 'events-kalzit.txt')
          } catch { "no events: $_" | Out-File (Join-Path $logs 'events-kalzit.txt') }
          try {
            Get-WinEvent -FilterHashtable @{ LogName = 'System'; ProviderName = 'Service Control Manager' } -MaxEvents 50 -ErrorAction Stop |
              Format-List TimeCreated, Message | Out-File (Join-Path $logs 'events-scm.txt')
          } catch { "no events: $_" | Out-File (Join-Path $logs 'events-scm.txt') }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: msi-logs
          path: ${{ runner.temp }}/msi-logs

  # The container image (Dockerfile): built for linux/amd64 with the faster e2e profile, then run
  # on its own and from deploy/docker/compose.postgres.yaml (.github/scripts/docker-smoke.sh).
  # Version tags build and push linux/amd64 and linux/arm64 (release.yml).
  docker:
    name: docker
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.docker == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Commit
        id: commit
        run: echo "short=$(git rev-parse --short=9 HEAD)" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: kalzit:ci
          build-args: |
            CARGO_PROFILE=e2e
            KALZIT_BUILD_COMMIT=${{ steps.commit.outputs.short }}
          cache-from: type=gha,scope=kalzit-image-amd64
          cache-to: ${{ github.event_name != 'merge_group' && 'type=gha,scope=kalzit-image-amd64,mode=max' || '' }}
      - run: .github/scripts/docker-smoke.sh kalzit:ci

  # The deb and rpm (deploy/linux): built with nfpm from a Linux binary (the faster e2e profile),
  # then installed, started, checked and removed on the runner under its own systemd and in
  # Debian and Fedora containers (.github/scripts/package-smoke.sh). Release tags build them
  # from the release binary (release.yml).
  packages:
    name: packages
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.docker == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: e2e-profile
          save-if: false
      - run: npm ci
        working-directory: ui
      - run: npm run build
        working-directory: ui
      - run: cargo build --profile e2e --locked -p kalzit --bin kalzit
      - name: Install nfpm
        env:
          NFPM_VERSION: 2.47.0
          NFPM_SHA256: 0660ca602b2d2d2ae4781a06c692b3eeb9d437ffea05b831d76e41f4a3188783
        run: |
          set -euo pipefail
          archive="nfpm_${NFPM_VERSION}_Linux_x86_64.tar.gz"
          curl -fsSL -o "$RUNNER_TEMP/$archive" "https://github.com/goreleaser/nfpm/releases/download/v${NFPM_VERSION}/$archive"
          echo "$NFPM_SHA256  $RUNNER_TEMP/$archive" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" nfpm
          sudo install -m 0755 "$RUNNER_TEMP/nfpm" /usr/local/bin/nfpm
      - name: Build the packages
        run: |
          version="$(grep -m1 '^version = ' server/Cargo.toml | cut -d'"' -f2)"
          deploy/linux/package.sh "$version" target/e2e/kalzit dist
          ls -l dist
          dpkg-deb --info dist/*.deb
          dpkg-deb --contents dist/*.deb
      - run: .github/scripts/package-smoke.sh dist

  # Ordering certificates from pebble, Let's Encrypt's ACME test server, built from its source at
  # a fixed tag: HTTP-01, TLS-ALPN-01, renewal and the encrypted store (server/tests/acme_pebble.rs).
  # pebble validates on 127.0.0.1 (pebble-challtestsrv answers every name with it); the test's
  # names resolve there for the server's own check too. Linux only; Windows runs the ACME unit
  # and API tests in `server`.
  acme:
    name: acme (pebble)
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.server == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: letsencrypt/pebble
          ref: v2.10.1
          path: pebble-src
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version-file: pebble-src/go.mod
          cache: false
      - name: Build pebble
        working-directory: pebble-src
        run: |
          mkdir -p "$RUNNER_TEMP/pebble-bin"
          go build -o "$RUNNER_TEMP/pebble-bin/" ./cmd/pebble ./cmd/pebble-challtestsrv
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: false
      - name: Build the test
        run: cargo test --locked -p kalzit --test acme_pebble --no-run
      - name: Start pebble
        working-directory: pebble-src
        env:
          PEBBLE_VA_NOSLEEP: "1"
          PEBBLE_WFE_NONCEREJECT: "0"
          PEBBLE_AUTHZREUSE: "0"
        run: |
          set -euo pipefail
          echo "127.0.0.1 http.kalzit.test alpn.kalzit.test" | sudo tee -a /etc/hosts
          # DNS only: the challenge servers of challtestsrv would take Kalzit's ports.
          nohup "$RUNNER_TEMP/pebble-bin/pebble-challtestsrv" -defaultIPv4 127.0.0.1 -defaultIPv6 "" \
            -http01 "" -https01 "" -tlsalpn01 "" -doh "" -dnsserver ":8053" -management ":8055" \
            > "$RUNNER_TEMP/challtestsrv.log" 2>&1 &
          challtestsrv=$!
          nohup "$RUNNER_TEMP/pebble-bin/pebble" -config test/config/pebble-config.json -dnsserver 127.0.0.1:8053 \
            > "$RUNNER_TEMP/pebble.log" 2>&1 &
          for _ in $(seq 1 60); do
            if curl -fsS --cacert test/certs/pebble.minica.pem https://localhost:14000/dir > /dev/null; then
              kill -0 "$challtestsrv" || { cat "$RUNNER_TEMP/challtestsrv.log"; exit 1; }
              echo "pebble is up"
              exit 0
            fi
            sleep 1
          done
          cat "$RUNNER_TEMP/pebble.log" "$RUNNER_TEMP/challtestsrv.log"
          exit 1
      - name: Order certificates from pebble
        env:
          KALZIT_TEST_PEBBLE_DIRECTORY: https://localhost:14000/dir
          KALZIT_TEST_PEBBLE_CA: ${{ github.workspace }}/pebble-src/test/certs/pebble.minica.pem
        run: cargo test --locked -p kalzit --test acme_pebble -- --ignored --nocapture
      - name: pebble log
        if: failure()
        run: cat "$RUNNER_TEMP/pebble.log" "$RUNNER_TEMP/challtestsrv.log"

  audit:
    name: audit
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.audit == 'true') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      - run: cargo audit
      - name: npm audit
        shell: bash
        run: |
          if [ -f ui/package-lock.json ]; then
            cd ui && npm audit --audit-level=high
          fi
