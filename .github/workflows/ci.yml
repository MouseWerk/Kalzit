name: CI

on:
  push:
    branches: [main]
  pull_request:
  # The merge queue tests each queued pull request on top of main before it merges.
  merge_group:
    types: [checks_requested]

concurrency:
  group: ci-${{ github.ref }}
  # A newer push to a pull request replaces its run; runs on main and in the queue all finish.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

# Which jobs run: on a pull request only those for the areas it changes (job `changes`, rules in
# .github/scripts/changes.sh and docs/ARCHITECTURE.md, "CI"); on main and in the merge queue all
# of them. A job without work still reports its check: the matrix jobs (server, ui, e2e) run and
# skip their steps, because a matrix job skipped as a whole reports no check per matrix value;
# the other jobs are skipped as a whole, which counts as passed. If `changes` fails, everything
# runs.
jobs:
  changes:
    name: changes
    runs-on: ubuntu-latest
    outputs:
      server: ${{ steps.areas.outputs.server }}
      ui: ${{ steps.areas.outputs.ui }}
      e2e: ${{ steps.areas.outputs.e2e }}
      audit: ${{ steps.areas.outputs.audit }}
    steps:
      # A pull request checks out its merge commit with main, whose first parent is main.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - name: Test the change detection
        run: .github/scripts/changes.test.sh
      # The log also shows the informational flags workflows and docs_only.
      - name: Changed areas
        id: areas
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$EVENT" = pull_request ]; then
            echo "Changed files:"
            .github/scripts/changes.sh HEAD^1 HEAD | tee -a "$GITHUB_OUTPUT"
          else
            echo "Event $EVENT: everything runs."
            .github/scripts/changes.sh < /dev/null | tee -a "$GITHUB_OUTPUT"
          fi

  server:
    name: server (${{ matrix.os }})
    needs: changes
    if: ${{ !cancelled() }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      RUN_JOB: ${{ needs.changes.result != 'success' || needs.changes.outputs.server == 'true' }}
    steps:
      - name: Nothing to check
        if: env.RUN_JOB != 'true'
        run: echo "No server change in this pull request; the checks are skipped."
      - uses: actions/checkout@v7
        if: env.RUN_JOB == 'true'
      - uses: dtolnay/rust-toolchain@stable
        if: env.RUN_JOB == 'true'
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        if: env.RUN_JOB == 'true'
        with:
          save-if: ${{ github.event_name != 'merge_group' }}
      - if: env.RUN_JOB == 'true'
        run: cargo fmt --all --check
      - if: env.RUN_JOB == 'true'
        run: cargo clippy --locked --all-targets -- -D warnings
      - if: env.RUN_JOB == 'true'
        run: cargo test --locked

  postgres:
    name: postgres
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.server == 'true') }}
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: kalzit
          POSTGRES_DB: kalzit
          # A throwaway container reachable only from this job; no password to leak or flag.
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U kalzit" --health-interval 2s --health-timeout 5s --health-retries 20
    env:
      KALZIT_TEST_POSTGRES_URL: postgres://kalzit@localhost:5432/kalzit
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.event_name != 'merge_group' }}
      - run: cargo test --locked --test api --test access --test explore_history --test team_spaces postgres -- --nocapture

  # The privilege switch of `kalzit update apply|rollback` (server/tests/update_rights.rs): run as
  # root on a data directory a service account owns, which needs sudo, so it is ignored elsewhere.
  update-rights:
    name: update rights (sudo)
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.server == 'true') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.event_name != 'merge_group' }}
      - name: Build the test as the runner user
        id: build
        shell: bash
        run: |
          cargo test --locked -p kalzit --test update_rights --no-run 2>&1 | tee build.log
          binary="$(grep -oE 'target/debug/deps/update_rights-[0-9a-f]+' build.log | head -1)"
          test -x "$binary"
          echo "binary=$binary" >> "$GITHUB_OUTPUT"
      - name: A service account and its private data directory
        run: |
          sudo useradd --system --no-create-home --shell /usr/sbin/nologin kalzit
          sudo install -d -o kalzit -g kalzit -m 0700 /var/lib/kalzit-rights-test
      - name: Run the test as root
        env:
          KALZIT_TEST_RIGHTS_DIR: /var/lib/kalzit-rights-test
        run: sudo env KALZIT_TEST_RIGHTS_DIR="$KALZIT_TEST_RIGHTS_DIR" "${{ steps.build.outputs.binary }}" --ignored --test-threads=1 --nocapture

  # Data sources against real servers. The passwords below belong to throwaway containers
  # reachable only from this job; they protect nothing and are not secrets. PostgreSQL uses a
  # password here (unlike the job above) so password handling and scrubbing are exercised.
  datasources:
    name: datasources
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.server == 'true') }}
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: kalzit
          POSTGRES_PASSWORD: kalzit-ci-pg
          POSTGRES_DB: kalzit
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U kalzit" --health-interval 2s --health-timeout 5s --health-retries 30
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: kalzit-ci-mysql
          MYSQL_DATABASE: kalzit
        ports: ["3306:3306"]
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -uroot -pkalzit-ci-mysql"
          --health-interval 2s --health-timeout 5s --health-retries 60
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: kalzit-ci-mariadb
          MARIADB_DATABASE: kalzit
        ports: ["3307:3306"]
        options: >-
          --health-cmd "healthcheck.sh --connect --innodb_initialized"
          --health-interval 2s --health-timeout 5s --health-retries 60
      mssql:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: "Kalzit-CI-mssql-1"
        ports: ["1433:1433"]
      prometheus:
        image: prom/prometheus:v3.5.0
        ports: ["9090:9090"]
      # Security on (basic auth over plain HTTP), so credentials and scrubbing are exercised.
      elasticsearch:
        image: docker.elastic.co/elasticsearch/elasticsearch:9.5.5
        env:
          discovery.type: single-node
          xpack.security.enabled: "true"
          xpack.security.http.ssl.enabled: "false"
          ELASTIC_PASSWORD: kalzit-ci-es
          cluster.routing.allocation.disk.threshold_enabled: "false"
          ES_JAVA_OPTS: -Xms512m -Xmx512m
        ports: ["9200:9200"]
      # The security plugin is off: the test covers a cluster without authentication.
      opensearch:
        image: opensearchproject/opensearch:3.9.0
        env:
          discovery.type: single-node
          DISABLE_SECURITY_PLUGIN: "true"
          DISABLE_INSTALL_DEMO_CONFIG: "true"
          cluster.routing.allocation.disk.threshold_enabled: "false"
          OPENSEARCH_JAVA_OPTS: -Xms512m -Xmx512m
        ports: ["9201:9200"]
      neo4j:
        image: neo4j:2026.10.0-community
        env:
          NEO4J_AUTH: neo4j/kalzit-ci-neo4j
        ports: ["7687:7687"]
      memgraph:
        image: memgraph/memgraph:3.14.0
        ports: ["7688:7687"]
      mongodb:
        image: mongo:8.2
        env:
          MONGO_INITDB_ROOT_USERNAME: kalzit
          MONGO_INITDB_ROOT_PASSWORD: kalzit-ci-mongo
        ports: ["27017:27017"]
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ ping: 1 }).ok'"
          --health-interval 2s --health-timeout 5s --health-retries 30
    env:
      KALZIT_TEST_REQUIRE_DATABASES: "1"
      KALZIT_TEST_POSTGRES_URL: postgres://kalzit:kalzit-ci-pg@localhost:5432/kalzit
      KALZIT_TEST_MYSQL_URL: mysql://root:kalzit-ci-mysql@127.0.0.1:3306/kalzit
      KALZIT_TEST_MARIADB_URL: mysql://root:kalzit-ci-mariadb@127.0.0.1:3307/kalzit
      KALZIT_TEST_MSSQL_URL: mssql://sa:Kalzit-CI-mssql-1@127.0.0.1:1433/master
      KALZIT_TEST_PROMETHEUS_URL: http://127.0.0.1:9090
      KALZIT_TEST_ELASTICSEARCH_URL: http://elastic:kalzit-ci-es@127.0.0.1:9200
      KALZIT_TEST_OPENSEARCH_URL: http://127.0.0.1:9201
      KALZIT_TEST_NEO4J_URL: bolt://neo4j:kalzit-ci-neo4j@127.0.0.1:7687
      KALZIT_TEST_MEMGRAPH_URL: bolt://127.0.0.1:7688
      KALZIT_TEST_MONGODB_URL: mongodb://kalzit:kalzit-ci-mongo@127.0.0.1:27017/?authSource=admin
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.event_name != 'merge_group' }}
      - run: cargo build --locked --tests
      - name: Wait for SQL Server, Prometheus, Elasticsearch, OpenSearch, Neo4j and Memgraph
        shell: bash
        run: |
          for i in $(seq 1 120); do
            if docker exec "${{ job.services.mssql.id }}" /opt/mssql-tools18/bin/sqlcmd -C -S localhost \
                 -U sa -P "Kalzit-CI-mssql-1" -Q "SELECT 1" > /dev/null 2>&1; then
              mssql=ok
            fi
            if curl -fs http://127.0.0.1:9090/-/ready > /dev/null; then prom=ok; fi
            if curl -fs -u elastic:kalzit-ci-es \
                 "http://127.0.0.1:9200/_cluster/health?wait_for_status=yellow&timeout=1s" > /dev/null; then
              es=ok
            fi
            if curl -fs "http://127.0.0.1:9201/_cluster/health?wait_for_status=yellow&timeout=1s" > /dev/null; then
              os=ok
            fi
            if docker exec "${{ job.services.neo4j.id }}" cypher-shell -u neo4j -p kalzit-ci-neo4j "RETURN 1" > /dev/null 2>&1; then neo4j=ok; fi
            if timeout 1 bash -c "</dev/tcp/127.0.0.1/7688" 2> /dev/null; then memgraph=ok; fi
            if [ "${mssql:-}" = ok ] && [ "${prom:-}" = ok ] && [ "${es:-}" = ok ] && [ "${os:-}" = ok ] \
                 && [ "${neo4j:-}" = ok ] && [ "${memgraph:-}" = ok ]; then
              exit 0
            fi
            sleep 2
          done
          echo "SQL Server, Prometheus, Elasticsearch, OpenSearch, Neo4j or Memgraph did not become ready" >&2
          exit 1
      - run: cargo test --locked --test datasources -- --nocapture
      - run: cargo test --locked --test mongodb -- --nocapture

  ui:
    name: ui (${{ matrix.os }})
    needs: changes
    if: ${{ !cancelled() }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    # A fixed zone, so tests about time zones cannot pass by the runner's accident.
    env:
      TZ: UTC
      RUN_JOB: ${{ needs.changes.result != 'success' || needs.changes.outputs.ui == 'true' }}
    defaults:
      run:
        working-directory: ui
    steps:
      - name: Nothing to check
        if: env.RUN_JOB != 'true'
        working-directory: .
        run: echo "No UI change in this pull request; the checks are skipped."
      - uses: actions/checkout@v7
        if: env.RUN_JOB == 'true'
      - name: Check for the UI
        if: env.RUN_JOB == 'true'
        id: has_ui
        shell: bash
        working-directory: .
        run: echo "present=$([ -f ui/package.json ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v7
        if: steps.has_ui.outputs.present == 'true'
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - if: steps.has_ui.outputs.present == 'true'
        run: npm ci
      - if: steps.has_ui.outputs.present == 'true'
        run: npm run format:check
      - if: steps.has_ui.outputs.present == 'true'
        run: npm run lint
      - if: steps.has_ui.outputs.present == 'true'
        run: npm run check
      - if: steps.has_ui.outputs.present == 'true'
        run: npm run typecheck
      - if: steps.has_ui.outputs.present == 'true'
        run: npm test
      - name: Tests in a zone with daylight saving time
        if: steps.has_ui.outputs.present == 'true' && runner.os == 'Linux'
        env:
          TZ: America/New_York
        run: npm test
      # This job checks the UI only: the license lists need cargo (the e2e and release builds
      # make them strictly), so here the build may do without.
      - if: steps.has_ui.outputs.present == 'true'
        run: npm run build
        env:
          KALZIT_LICENSES_STRICT: "0"

  # End-to-end tests against the server binary with the embedded UI (ui/e2e), built with the
  # e2e profile (release settings, less optimization, so it builds faster). Not a required check
  # yet.
  e2e:
    name: e2e (${{ matrix.os }})
    needs: changes
    if: ${{ !cancelled() }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    # A run takes 5 (Linux) to 10 minutes (Windows), about twice that with a cold build cache;
    # the steps that download have their own, shorter limits.
    timeout-minutes: 30
    env:
      KALZIT_E2E_BINARY: ${{ github.workspace }}/target/e2e/kalzit${{ matrix.os == 'windows-latest' && '.exe' || '' }}
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.playwright-browsers
      RUN_JOB: ${{ needs.changes.result != 'success' || needs.changes.outputs.e2e == 'true' }}
    steps:
      - name: Nothing to check
        if: env.RUN_JOB != 'true'
        run: echo "No server or UI change in this pull request; the end-to-end tests are skipped."
      - uses: actions/checkout@v7
        if: env.RUN_JOB == 'true'
      - uses: actions/setup-node@v7
        if: env.RUN_JOB == 'true'
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        if: env.RUN_JOB == 'true'
      - uses: Swatinem/rust-cache@v2
        if: env.RUN_JOB == 'true'
        with:
          key: e2e-profile
          save-if: ${{ github.event_name != 'merge_group' }}
      - run: npm ci
        if: env.RUN_JOB == 'true'
        working-directory: ui
      # Strict (CI is set): the license lists of the bundle need cargo, which is installed above.
      - run: npm run build
        if: env.RUN_JOB == 'true'
        working-directory: ui
      - run: cargo build --profile e2e --locked -p kalzit
        if: env.RUN_JOB == 'true'
      # The browsers belong to the Playwright version, so other dependency updates keep the cache.
      - name: Playwright version
        if: env.RUN_JOB == 'true'
        id: playwright
        working-directory: ui
        shell: bash
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      # A merge queue run restores the browsers but does not save, since its cache would be its own.
      - name: Restore Playwright browsers
        if: env.RUN_JOB == 'true'
        id: browsers
        uses: actions/cache/restore@v6
        with:
          path: .playwright-browsers
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - name: Install Playwright browsers
        if: env.RUN_JOB == 'true' && steps.browsers.outputs.cache-hit != 'true'
        timeout-minutes: 10
        working-directory: ui
        shell: bash
        run: |
          for attempt in 1 2 3; do
            npx playwright install chromium firefox webkit && exit 0
            echo "::warning::installing the browsers failed (attempt $attempt of 3)"
          done
          exit 1
      - name: Save Playwright browsers
        if: >-
          env.RUN_JOB == 'true' && steps.browsers.outputs.cache-hit != 'true'
          && github.event_name != 'merge_group'
        uses: actions/cache/save@v6
        with:
          path: .playwright-browsers
          key: ${{ steps.browsers.outputs.cache-primary-key }}
      # The system packages (about 190, 140 MB, most of them WebKit's and Firefox's media
      # libraries) come from the runner's package mirror, which sometimes slows to a few kB/s
      # without failing. They are kept between runs per runner image, so apt downloads only what
      # changed; .github/scripts/browser-deps.sh retries with a limit per attempt and moves to
      # the main Ubuntu archive. Its test runs first, so a broken retry shows before it is needed.
      # A merge queue run restores them but does not save, since its cache would be its own.
      - name: Test the browser package install script
        if: env.RUN_JOB == 'true' && runner.os == 'Linux'
        run: .github/scripts/browser-deps.test.sh
      - name: Runner image
        if: env.RUN_JOB == 'true' && runner.os == 'Linux'
        id: image
        run: echo "name=$ImageOS-$ImageVersion" >> "$GITHUB_OUTPUT"
      - name: Restore browser system packages
        if: env.RUN_JOB == 'true' && runner.os == 'Linux'
        id: debs
        uses: actions/cache/restore@v6
        with:
          path: ~/.cache/kalzit-browser-debs
          key: browser-debs-${{ steps.image.outputs.name }}-playwright-${{ steps.playwright.outputs.version }}
          restore-keys: browser-debs-
      - name: Install browser system packages
        if: env.RUN_JOB == 'true' && runner.os == 'Linux'
        timeout-minutes: 12
        working-directory: ui
        run: |
          DEPS_CACHE="$HOME/.cache/kalzit-browser-debs" ../.github/scripts/browser-deps.sh \
            node node_modules/@playwright/test/cli.js install-deps chromium firefox webkit
      - name: Save browser system packages
        if: >-
          env.RUN_JOB == 'true' && runner.os == 'Linux' && steps.debs.outputs.cache-hit != 'true'
          && github.event_name != 'merge_group'
        uses: actions/cache/save@v6
        with:
          path: ~/.cache/kalzit-browser-debs
          key: ${{ steps.debs.outputs.cache-primary-key }}
      - run: npm run e2e
        if: env.RUN_JOB == 'true'
        timeout-minutes: 15
        working-directory: ui
      - uses: actions/upload-artifact@v7
        if: ${{ !success() }}
        with:
          name: e2e-${{ matrix.os }}
          path: ui/e2e/.output
          if-no-files-found: ignore
          # .output starts with a dot; without this the traces and screenshots are left out.
          include-hidden-files: true
          retention-days: 14

  audit:
    name: audit
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.audit == 'true') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      - run: cargo audit
      - name: npm audit
        shell: bash
        run: |
          if [ -f ui/package-lock.json ]; then
            cd ui && npm audit --audit-level=high
          fi
