name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  server:
    name: server (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked

  postgres:
    name: postgres
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: kalzit
          POSTGRES_DB: kalzit
          # A throwaway container reachable only from this job; no password to leak or flag.
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U kalzit" --health-interval 2s --health-timeout 5s --health-retries 20
    env:
      KALZIT_TEST_POSTGRES_URL: postgres://kalzit@localhost:5432/kalzit
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --locked --test api --test access postgres -- --nocapture

  # Data sources against real servers. The passwords below belong to throwaway containers
  # reachable only from this job; they protect nothing and are not secrets. PostgreSQL uses a
  # password here (unlike the job above) so password handling and scrubbing are exercised.
  datasources:
    name: datasources
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: kalzit
          POSTGRES_PASSWORD: kalzit-ci-pg
          POSTGRES_DB: kalzit
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U kalzit" --health-interval 2s --health-timeout 5s --health-retries 30
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: kalzit-ci-mysql
          MYSQL_DATABASE: kalzit
        ports: ["3306:3306"]
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -uroot -pkalzit-ci-mysql"
          --health-interval 2s --health-timeout 5s --health-retries 60
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: kalzit-ci-mariadb
          MARIADB_DATABASE: kalzit
        ports: ["3307:3306"]
        options: >-
          --health-cmd "healthcheck.sh --connect --innodb_initialized"
          --health-interval 2s --health-timeout 5s --health-retries 60
      mssql:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: "Kalzit-CI-mssql-1"
        ports: ["1433:1433"]
      prometheus:
        image: prom/prometheus:v3.5.0
        ports: ["9090:9090"]
      neo4j:
        image: neo4j:2026.10.0-community
        env:
          NEO4J_AUTH: neo4j/kalzit-ci-neo4j
        ports: ["7687:7687"]
      memgraph:
        image: memgraph/memgraph:3.14.0
        ports: ["7688:7687"]
      mongodb:
        image: mongo:8.2
        env:
          MONGO_INITDB_ROOT_USERNAME: kalzit
          MONGO_INITDB_ROOT_PASSWORD: kalzit-ci-mongo
        ports: ["27017:27017"]
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ ping: 1 }).ok'"
          --health-interval 2s --health-timeout 5s --health-retries 30
    env:
      KALZIT_TEST_REQUIRE_DATABASES: "1"
      KALZIT_TEST_POSTGRES_URL: postgres://kalzit:kalzit-ci-pg@localhost:5432/kalzit
      KALZIT_TEST_MYSQL_URL: mysql://root:kalzit-ci-mysql@127.0.0.1:3306/kalzit
      KALZIT_TEST_MARIADB_URL: mysql://root:kalzit-ci-mariadb@127.0.0.1:3307/kalzit
      KALZIT_TEST_MSSQL_URL: mssql://sa:Kalzit-CI-mssql-1@127.0.0.1:1433/master
      KALZIT_TEST_PROMETHEUS_URL: http://127.0.0.1:9090
      KALZIT_TEST_NEO4J_URL: bolt://neo4j:kalzit-ci-neo4j@127.0.0.1:7687
      KALZIT_TEST_MEMGRAPH_URL: bolt://127.0.0.1:7688
      KALZIT_TEST_MONGODB_URL: mongodb://kalzit:kalzit-ci-mongo@127.0.0.1:27017/?authSource=admin
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --locked --tests
      - name: Wait for SQL Server, Prometheus, Neo4j and Memgraph
        shell: bash
        run: |
          for i in $(seq 1 90); do
            if docker exec "${{ job.services.mssql.id }}" /opt/mssql-tools18/bin/sqlcmd -C -S localhost \
                 -U sa -P "Kalzit-CI-mssql-1" -Q "SELECT 1" > /dev/null 2>&1; then
              mssql=ok
            fi
            if curl -fs http://127.0.0.1:9090/-/ready > /dev/null; then prom=ok; fi
            if docker exec "${{ job.services.neo4j.id }}" cypher-shell -u neo4j -p kalzit-ci-neo4j "RETURN 1" > /dev/null 2>&1; then neo4j=ok; fi
            if timeout 1 bash -c "</dev/tcp/127.0.0.1/7688" 2> /dev/null; then memgraph=ok; fi
            if [ "${mssql:-}" = ok ] && [ "${prom:-}" = ok ] && [ "${neo4j:-}" = ok ] && [ "${memgraph:-}" = ok ]; then exit 0; fi
            sleep 2
          done
          echo "SQL Server, Prometheus, Neo4j or Memgraph did not become ready" >&2
          exit 1
      - run: cargo test --locked --test datasources -- --nocapture
      - run: cargo test --locked --test mongodb -- --nocapture

  ui:
    name: ui (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    # A fixed zone, so tests about time zones cannot pass by the runner's accident.
    env:
      TZ: UTC
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v7
      - name: Check for the UI
        id: has_ui
        shell: bash
        working-directory: .
        run: echo "present=$([ -f ui/package.json ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v7
        if: steps.has_ui.outputs.present == 'true'
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - if: steps.has_ui.outputs.present == 'true'
        run: npm ci
      - if: steps.has_ui.outputs.present == 'true'
        run: npm run format:check
      - if: steps.has_ui.outputs.present == 'true'
        run: npm run lint
      - if: steps.has_ui.outputs.present == 'true'
        run: npm run check
      - if: steps.has_ui.outputs.present == 'true'
        run: npm run typecheck
      - if: steps.has_ui.outputs.present == 'true'
        run: npm test
      - name: Tests in a zone with daylight saving time
        if: steps.has_ui.outputs.present == 'true' && runner.os == 'Linux'
        env:
          TZ: America/New_York
        run: npm test
      - if: steps.has_ui.outputs.present == 'true'
        run: npm run build

  # End-to-end tests against the server binary with the embedded UI (ui/e2e), built with the
  # e2e profile (release settings, less optimization, so it builds faster). Not a required check
  # yet.
  e2e:
    name: e2e (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    # A run takes 5 (Linux) to 10 minutes (Windows), about twice that with a cold build cache;
    # the steps that download have their own, shorter limits.
    timeout-minutes: 30
    env:
      KALZIT_E2E_BINARY: ${{ github.workspace }}/target/e2e/kalzit${{ matrix.os == 'windows-latest' && '.exe' || '' }}
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.playwright-browsers
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: e2e-profile
      - run: npm ci
        working-directory: ui
      - run: npm run build
        working-directory: ui
      - run: cargo build --profile e2e --locked -p kalzit
      # The browsers belong to the Playwright version, so other dependency updates keep the cache.
      - name: Playwright version
        id: playwright
        working-directory: ui
        shell: bash
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Cache Playwright browsers
        id: browsers
        uses: actions/cache@v6
        with:
          path: .playwright-browsers
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - name: Install Playwright browsers
        if: steps.browsers.outputs.cache-hit != 'true'
        timeout-minutes: 10
        working-directory: ui
        shell: bash
        run: |
          for attempt in 1 2 3; do
            npx playwright install chromium firefox webkit && exit 0
            echo "::warning::installing the browsers failed (attempt $attempt of 3)"
          done
          exit 1
      # Usually 20 s, but the runner's package mirror sometimes slows to a few kB/s without
      # failing. Each attempt gets 3 minutes; from the second on, the main Ubuntu archive. Run as
      # root so `timeout` can stop apt and the downloads it started. An attempt stopped while
      # dpkg was unpacking leaves it half done, so the next one finishes that first.
      - name: Install browser system packages
        if: runner.os == 'Linux'
        timeout-minutes: 12
        working-directory: ui
        run: |
          printf 'Acquire::Retries "3";\nAcquire::http::Timeout "30";\nAcquire::https::Timeout "30";\n' |
            sudo tee /etc/apt/apt.conf.d/80-kalzit-ci > /dev/null
          mirror=azure.archive.ubuntu.com
          for attempt in 1 2 3; do
            if [ "$attempt" -gt 1 ]; then
              echo "::warning::installing the browser system packages failed or stalled (attempt $((attempt - 1)) of 3)"
              sudo dpkg --configure -a || true
            fi
            if [ "$attempt" -eq 2 ]; then
              lists=$(sudo grep -l -F "://$mirror/" /etc/apt/sources.list /etc/apt/sources.list.d/* 2>/dev/null || true)
              if [ -z "$lists" ]; then
                echo "::notice::no apt source names $mirror; retrying with the configured sources"
              fi
              for list in $lists; do
                sudo sed -i "s#://$mirror/#://archive.ubuntu.com/#g" "$list"
                echo "switched $list to archive.ubuntu.com"
              done
            fi
            sudo env "PATH=$PATH" timeout --kill-after=15 180 \
              node node_modules/@playwright/test/cli.js install-deps chromium firefox webkit && exit 0
          done
          exit 1
      - run: npm run e2e
        timeout-minutes: 15
        working-directory: ui
      - uses: actions/upload-artifact@v7
        if: ${{ !success() }}
        with:
          name: e2e-${{ matrix.os }}
          path: ui/e2e/.output
          if-no-files-found: ignore
          retention-days: 14

  audit:
    name: audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      - run: cargo audit
      - name: npm audit
        shell: bash
        run: |
          if [ -f ui/package-lock.json ]; then
            cd ui && npm audit --audit-level=high
          fi
