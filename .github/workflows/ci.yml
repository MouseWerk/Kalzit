name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  server:
    name: server (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked

  postgres:
    name: postgres
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: kalzit
          POSTGRES_PASSWORD: kalzit
          POSTGRES_DB: kalzit
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U kalzit" --health-interval 2s --health-timeout 5s --health-retries 20
    env:
      KALZIT_TEST_POSTGRES_URL: postgres://kalzit:kalzit@localhost:5432/kalzit
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --locked --test api postgres -- --nocapture

  ui:
    name: ui (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v7
      - name: Check for the UI
        id: has_ui
        shell: bash
        working-directory: .
        run: echo "present=$([ -f ui/package.json ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v7
        if: steps.has_ui.outputs.present == 'true'
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - if: steps.has_ui.outputs.present == 'true'
        run: npm ci
      - if: steps.has_ui.outputs.present == 'true'
        run: npm run format:check
      - if: steps.has_ui.outputs.present == 'true'
        run: npm run lint
      - if: steps.has_ui.outputs.present == 'true'
        run: npm run typecheck
      - if: steps.has_ui.outputs.present == 'true'
        run: npm test
      - if: steps.has_ui.outputs.present == 'true'
        run: npm run build

  audit:
    name: audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      - run: cargo audit
      - name: npm audit
        shell: bash
        run: |
          if [ -f ui/package-lock.json ]; then
            cd ui && npm audit --audit-level=high
          fi
