name: TigerGraph nightly

# TigerGraph is too large for the PR check (an image of 2.5 GB compressed, minutes to start and to
# install queries, no Windows container), so the PR check tests it against a fake server
# (server/src/datasources/tigergraph/tests.rs) and this job runs the same rules against the real
# Community Edition image once a night, and on demand. It is not a required check.
#
# The Community Edition needs no license and runs on a standard GitHub-hosted runner (4 cores,
# 16 GB). Setup: .github/tigergraph/ (REST++ authentication on, schema, data, installed queries,
# a queryreader and a querywriter user); probe.sh prints the raw answers of every endpoint Kalzit
# calls; the tests are server/tests/tigergraph_real.rs, ignored unless run with --ignored and
# KALZIT_TEST_TIGERGRAPH_URL. Last, tls.sh puts an HTTPS proxy with a private CA in front for the
# TLS test (TigerGraph's own HTTPS needs an Enterprise license). TigerGraph 3.x has no freely
# available image and is tested against the fake only.

on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tigergraph-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  # tigergraph/community:4.2.5, pinned by digest.
  TIGERGRAPH_IMAGE: tigergraph/community@sha256:190c505bf5c22c90e597b901ea8fcfaf2da7e883b688d7d48c8fe60af0a20ddb

jobs:
  tigergraph:
    name: tigergraph (real image)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Free disk space for the image
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /
      - name: Start TigerGraph
        run: |
          docker pull --quiet "$TIGERGRAPH_IMAGE"
          docker run -d --name tigergraph -p 127.0.0.1:14240:14240 \
            --ulimit nofile=1000000:1000000 -t "$TIGERGRAPH_IMAGE"
          df -h /
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch, 2026-10
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Build the tests (while TigerGraph starts)
        run: cargo build --locked --tests
      # Setup and probe run even when the build failed, so the log still shows the server's answers.
      - name: Set up the graph, queries and users
        if: ${{ !cancelled() }}
        timeout-minutes: 40
        run: bash .github/tigergraph/setup.sh
      - name: Raw answers of the endpoints Kalzit calls
        if: ${{ !cancelled() }}
        run: bash .github/tigergraph/probe.sh
      - name: Tests against the real instance
        env:
          KALZIT_TEST_TIGERGRAPH_URL: http://127.0.0.1:14240
        run: cargo test --locked --test tigergraph_real -- --ignored --nocapture --test-threads 1 --skip tls_
      - name: HTTPS in front of TigerGraph with a private CA
        run: bash .github/tigergraph/tls.sh "$RUNNER_TEMP/tigergraph-ca.pem"
      - name: TLS test against the real instance
        env:
          KALZIT_TEST_TIGERGRAPH_URL: https://localhost:14243
          KALZIT_TEST_TIGERGRAPH_CA: ${{ runner.temp }}/tigergraph-ca.pem
        run: cargo test --locked --test tigergraph_real -- --ignored --nocapture --exact tls_with_a_private_ca
      - name: TigerGraph logs on failure
        if: failure()
        run: |
          docker exec tigergraph bash -lc 'export PATH=$PATH:/home/tigergraph/tigergraph/app/cmd; gadmin status -v' || true
          docker logs --tail 200 tigergraph || true
