# The deb and rpm of Kalzit, built by deploy/linux/package.sh with nfpm (https://nfpm.goreleaser.com).
# package.sh fills in @VERSION@, @GLIBC@ (the newest glibc symbol version the binary uses),
# @WORK@ (its work folder with the binary and the package markers) and @ROOT@ (the repository).

name: kalzit
arch: amd64
platform: linux
version: "@VERSION@"
version_schema: semver
release: "1"
section: web
priority: optional
maintainer: Maurice Kleindienst <kleindiema@gmail.com>
vendor: MouseWerk
homepage: https://github.com/MouseWerk/Kalzit
license: AGPL-3.0-only
description: |
  Self-hosted platform to visualize and analyze data.
  Dashboards, Explore, SQL and metrics sources, with document (MongoDB) and graph databases
  (Neo4j, Memgraph, TigerGraph) as native data shapes. One binary with the web interface,
  run as the systemd service `kalzit`.

overrides:
  deb:
    depends:
      - "libc6 (>= @GLIBC@)"
  rpm:
    depends:
      - "glibc >= @GLIBC@"
      # useradd and groupadd for the service account (deb: in the essential package passwd).
      - shadow-utils

contents:
  - src: "@WORK@/kalzit"
    dst: /usr/bin/kalzit
    file_info:
      mode: 0755
  - src: "@ROOT@/deploy/linux/kalzit.service"
    dst: /usr/lib/systemd/system/kalzit.service
    file_info:
      mode: 0644
  - dst: /etc/kalzit
    type: dir
    file_info:
      mode: 0750
      owner: root
      group: kalzit
  - src: "@ROOT@/deploy/linux/kalzit.toml"
    dst: /etc/kalzit/kalzit.toml
    type: config|noreplace
    file_info:
      mode: 0640
      owner: root
      group: kalzit
  # Which package manager owns /usr/bin/kalzit; the server then leaves updates to it
  # (server/src/updates/platform.rs).
  - src: "@WORK@/package-deb"
    dst: /usr/lib/kalzit/package
    packager: deb
    file_info:
      mode: 0644
  - src: "@WORK@/package-rpm"
    dst: /usr/lib/kalzit/package
    packager: rpm
    file_info:
      mode: 0644
  # Allows the plugin sandbox's user namespaces where AppArmor restricts them (Ubuntu); loaded by
  # postinstall.sh when AppArmor is active.
  - src: "@ROOT@/deploy/linux/apparmor-kalzit"
    dst: /etc/apparmor.d/kalzit
    type: config|noreplace
    packager: deb
    file_info:
      mode: 0644
  - src: "@ROOT@/LICENSE"
    dst: /usr/share/doc/kalzit/copyright
    packager: deb
    file_info:
      mode: 0644
  - src: "@ROOT@/LICENSE"
    dst: /usr/share/licenses/kalzit/LICENSE
    packager: rpm
    type: license
    file_info:
      mode: 0644

scripts:
  preinstall: "@ROOT@/deploy/linux/scripts/preinstall.sh"
  postinstall: "@ROOT@/deploy/linux/scripts/postinstall.sh"
  preremove: "@ROOT@/deploy/linux/scripts/preremove.sh"
  postremove: "@ROOT@/deploy/linux/scripts/postremove.sh"

rpm:
  summary: Self-hosted platform to visualize and analyze data
  group: Applications/Internet
  compression: zstd

deb:
  compression: zstd
