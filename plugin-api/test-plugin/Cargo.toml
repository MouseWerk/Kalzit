[package]
name = "kalzit-test-plugin"
version = "0.0.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false
description = "A data source plugin for the host's contract tests: behaves normally, crashes, hangs, floods and breaks the protocol on request"

# Test-only: the server's plugin tests build and package it. Never shipped.
[dependencies]
futures-util = "0.3.34"
kalzit-plugin-api = { path = "..", features = ["connector"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["rt", "macros", "net", "io-util", "time"] }
tonic = { version = "0.14.8", default-features = false, features = ["codegen", "server", "router"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2.191"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_System_Pipes", "Win32_System_Threading"] }
