[package]
name = "kalzit-release"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "The format of signed Kalzit releases, and the signing tool kalzit-sign"

# Kept small on purpose: the release workflow builds this crate next to the signing key, so it
# must not pull in the server's dependency tree.
[dependencies]
base64 = "0.23.1"
ed25519-dalek = { version = "=2.2.0", default-features = false, features = ["std", "zeroize"] }
getrandom = { version = "0.4.3", features = ["std"] }
hex = "0.4.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
zeroize = "1.9.1"

[[bin]]
name = "kalzit-sign"
path = "src/main.rs"
