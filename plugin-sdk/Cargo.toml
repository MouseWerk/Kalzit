[package]
name = "kalzit-plugin-sdk"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Write Kalzit data source plugins in Rust: implement DataSource, call run, and the SDK handles the handshake, the local transport, the token, deadlines, cancellation and chunking"
keywords = ["kalzit", "plugin", "datasource", "grpc"]
categories = ["database", "visualization"]

# The SDK a plugin author depends on. It keeps to the plugin contract (kalzit-plugin-api) and the
# gRPC server; no server types.
[dependencies]
futures-util = "0.3.34"
kalzit-plugin-api = { path = "../plugin-api", version = "0.1.0", features = ["connector"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "net", "io-util", "time", "sync"] }
tonic = { version = "0.14.8", default-features = false, features = ["codegen", "server", "router"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_System_Pipes", "Win32_System_Threading"] }

[dev-dependencies]
hyper-util = { version = "0.1.21", features = ["tokio"] }
tonic = { version = "0.14.8", default-features = false, features = ["codegen", "channel"] }
tower = { version = "0.5.3", features = ["util"] }
