[package]
name = "kalzit"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
aes-gcm = { version = "0.11.1", features = ["zeroize"] }
anyhow = "1.0.104"
argon2 = "0.6.0"
async-trait = "0.1.92"
axum = { version = "0.8.9", features = ["macros"] }
axum-server = { version = "0.8.0", features = ["tls-rustls-no-provider"] }
base64 = "0.22.1"
chrono = { version = "0.4", default-features = false, features = ["std"] }
clap = { version = "4.6.7", features = ["derive", "env"] }
futures-util = "0.3.34"
hex = "0.4.3"
ipnet = { version = "2.12.2", features = ["serde"] }
mime_guess = "2.0.5"
rand = "0.10.3"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls-no-provider", "system-proxy"] }
rust-embed = "8.13.0"
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12", "logging"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
sqlx = { version = "0.9.0", default-features = false, features = [
    "runtime-tokio", "any", "sqlite", "postgres", "mysql", "migrate", "macros", "chrono", "json",
    "tls-rustls-ring-native-roots",
] }
sqlparser = { version = "0.63.0", features = ["visitor"] }
thiserror = "2.0.21"
tiberius = { version = "0.13.0", default-features = false, features = ["tds80", "rustls", "chrono"] }
tokio = { version = "1.54.0", features = ["rt-multi-thread", "macros", "signal", "net", "fs", "time", "sync", "io-util"] }
tokio-util = { version = "0.7.20", features = ["compat"] }
toml = "1.1.8"
tower = { version = "0.5.3", features = ["util"] }
tower-http = { version = "0.7.1", features = ["trace", "set-header"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt", "json"] }
uuid = { version = "1.28.0", features = ["v7"] }
zeroize = "1.9.1"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_Security_Cryptography"] }

[dev-dependencies]
http-body-util = "0.1.5"
rcgen = "0.14.10"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls-no-provider", "json"] }
tempfile = "3.27.0"
tower = { version = "0.5.3", features = ["util"] }
ts-rs = { version = "12.0.1", features = ["serde-json-impl"] }

