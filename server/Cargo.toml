[package]
name = "kalzit"
version = "0.3.0"
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
aes-gcm = { version = "0.11.1", features = ["zeroize"] }
anyhow = "1.0.104"
argon2 = "0.6.0"
async-trait = "0.1.92"
axum = { version = "0.8.9", features = ["macros", "multipart", "ws"] }
axum-server = { version = "0.8.0", features = ["tls-rustls-no-provider"] }
base64 = "0.23.1"
bson = { version = "3.1.0", features = ["serde", "serde_json-1"] }
chrono = { version = "0.4", default-features = false, features = ["std"] }
clap = { version = "4.6.7", features = ["derive", "env"] }
ed25519-dalek = { version = "=2.2.0", default-features = false, features = ["std", "zeroize"] }
futures-util = "0.3.34"
hex = "0.4.3"
kalzit-plugin-api = { path = "../plugin-api" }
kalzit-release = { path = "../release" }
ipnet = { version = "2.12.2", features = ["serde"] }
mime_guess = "2.0.5"
mongodb = { version = "3.9.1", default-features = false, features = ["compat-3-3-0", "bson-3", "rustls-tls", "dns-resolver", "socks5-proxy"] }
rand = "0.10.3"
regex = { version = "1.12.2", default-features = false, features = ["std", "unicode"] }
reqwest = { version = "0.13.5", default-features = false, features = ["rustls-no-provider"] }
rust-embed = "8.13.0"
rust_xlsxwriter = { version = "0.101.0", default-features = false, features = ["constant_memory"] }
# Spool files of Excel exports (constant memory mode) in a private folder.
tempfile = "3.27.0"
ryu-js = "1.0.3"
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rustls-native-certs = "0.8.5"
semver = "1.0.28"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["float_roundtrip"] }
sha2 = "0.11.1"
sqlx = { version = "0.9.0", default-features = false, features = [
    "runtime-tokio", "any", "sqlite", "postgres", "mysql", "migrate", "macros", "chrono", "json",
    "tls-rustls-ring-native-roots",
] }
sqlparser = { version = "0.63.0", features = ["visitor"] }
subtle = "2.6.1"
thiserror = "2.0.21"
tiberius = { version = "0.13.0", default-features = false, features = ["tds80", "rustls", "chrono"] }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "signal", "net", "fs", "time", "sync", "io-util", "process"] }
tokio-rustls = { version = "0.26.6", default-features = false, features = ["ring", "tls12", "logging"] }
tokio-util = { version = "0.7.20", features = ["compat", "io"] }
# gRPC types of the plugin protocol (kalzit-plugin-api); no transport yet. prost sizes its parts.
prost = "0.14.4"
tonic = { version = "0.14.8", default-features = false, features = ["codegen"] }
toml = "1.1.8"
tower = { version = "0.5.3", features = ["util"] }
unicode-normalization = "0.1.26"
tower-http = { version = "0.7.1", features = ["trace", "set-header"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt", "json"] }
url = "2.5.8"
uuid = { version = "1.28.0", features = ["v7"] }
zeroize = { version = "1.9.1", features = ["serde"] }
chrono-tz = { version = "0.10", default-features = false, features = ["std"] }

[target.'cfg(unix)'.dependencies]
# statvfs, for the free space the Updates page shows before an installation.
libc = "0.2.191"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = [
    "Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Security_Cryptography",
    "Win32_Storage_FileSystem", "Win32_System_Threading",
] }

[dev-dependencies]
http-body-util = "0.1.5"
rcgen = "0.14.10"
# A WebSocket client for the live update tests; the version axum's server side uses.
tokio-tungstenite = "0.29.0"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls-no-provider", "json"] }
tower = { version = "0.5.3", features = ["util"] }
ts-rs = { version = "12.0.1", features = ["serde-json-impl"] }
# Reads the xlsx files of the export tests; the version rust_xlsxwriter writes them with.
zip = { version = "9.0.5", default-features = false, features = ["deflate"] }

