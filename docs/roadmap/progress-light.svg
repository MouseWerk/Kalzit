<svg xmlns="http://www.w3.org/2000/svg" width="880" height="430" viewBox="0 0 880 430" role="img" aria-labelledby="title desc">
<title id="title">Kalzit milestone progress</title>
<desc id="desc">Milestone progress. M0 Foundation: done. M1 Core: done. M2 Documents: done. M3 Graphs: done. M4 Plugins and AI: done. M5 Operations: done. M6 Polish: done. M7 Expansion: done. M8 Analysis depth: planned. M9 Plugin store: planned. M10 Icon set: planned. M11 Multi-model and own data: planned.</desc>
<defs>
<linearGradient id="sweep" x1="0" x2="1" y1="0" y2="0">
<stop offset="0" stop-color="#17171a" stop-opacity="0"/>
<stop offset="0.5" stop-color="#17171a" stop-opacity="0.45"/>
<stop offset="1" stop-color="#17171a" stop-opacity="0"/>
</linearGradient>
</defs>
<style>
text{font-family:"Instrument Sans","Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;font-size:13px;fill:#57575f;font-variant-numeric:tabular-nums}
.title{font-size:14px;font-weight:600;fill:#17171a}
.id{font-family:"JetBrains Mono",ui-monospace,"Cascadia Code","SF Mono",Menlo,Consolas,monospace;font-size:12px;font-weight:600;fill:#17171a}
.status.current{fill:#17171a;font-weight:600}
.track{fill:#e1e1e4}
.fill{fill:#57575f;transform-box:fill-box;transform-origin:left center;animation:grow 1.2s cubic-bezier(.22,.7,.2,1) backwards}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@media (prefers-reduced-motion:reduce){.fill,.sweep{animation:none}}
</style>
<rect x="0.5" y="0.5" width="879" height="429" rx="12" fill="#ffffff" stroke="#e1e1e4"/>
<text class="title" x="24" y="36">Milestones</text>
