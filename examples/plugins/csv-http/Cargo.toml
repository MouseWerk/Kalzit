[package]
name = "kalzit-csv-http"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false
description = "Example Kalzit data source plugin: a CSV or JSON file from an HTTP or HTTPS URL as a frame"

[dependencies]
kalzit-plugin-sdk = { path = "../../../plugin-sdk" }
reqwest = { version = "0.13.5", default-features = false, features = ["rustls-no-provider"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12", "logging"] }
serde_json = "1.0.154"

[dev-dependencies]
tokio = { version = "1.54.1", features = ["rt", "macros"] }
