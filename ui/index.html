<!doctype html>
<html lang="en" data-theme="system">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>Kalzit</title>
    <link rel="stylesheet" href="/layers.css" />
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <script src="/theme-boot.js"></script>
    <script type="module" src="/src/main.tsx"></script>
  </head>
  <body>
    <div id="root"></div>
    <!--
      The boot state: drawn from the first byte, in the stored theme (theme-boot.js) and the app's
      colors (src/styles/base.css), until the first page has rendered (src/app/boot.ts takes it
      away). Decorative only; the page that follows says what it is.
    -->
    <div id="boot" class="boot" aria-hidden="true">
      <svg class="boot__mark" aria-hidden="true" viewBox="0 0 24 24" width="40" height="40" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
        <path d="M3.1 8.25 7.6 3.95l11.5-2 1.8 13.6-4 4.4L5.6 22.05ZM3.1 8.25 14.6 6.35l2.3 13.6M14.6 6.35l4.5-4.4" />
      </svg>
      <span class="boot__bar"></span>
    </div>
  </body>
</html>
